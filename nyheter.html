<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BREAKING NEWS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,Helvetica,sans-serif;background:#0a1628;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
    .breakingBar{background:#cc0000;padding:8px 0;text-align:center;animation:flashRed 1s infinite;}
    .breakingBar h1{color:white;font-size:2.5rem;font-weight:900;letter-spacing:6px;text-transform:uppercase;}
    @keyframes flashRed{0%,100%{background:#cc0000;}50%{background:#ff0000;}}
    .mainContent{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#0a1628 0%,#1a2a4a 100%);padding:30px;position:relative;}
    .liveTag{position:absolute;top:20px;right:30px;background:#cc0000;color:white;padding:6px 18px;font-weight:900;font-size:1.2rem;border-radius:4px;animation:livePulse 2s infinite;}
    @keyframes livePulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
    .timestamp{position:absolute;top:20px;left:30px;color:#8899bb;font-size:1rem;}
    .headline{color:white;font-size:2.6rem;font-weight:900;text-align:center;text-transform:uppercase;line-height:1.3;max-width:90%;opacity:0;transition:opacity 0.8s;}
    .headline.visible{opacity:1;}
    .headline .name{color:#ff4444;}
    .subtitle{color:#aabbdd;font-size:1.2rem;margin-top:15px;text-align:center;opacity:0;transition:opacity 0.8s 0.3s;font-style:italic;}
    .subtitle.visible{opacity:1;}
    .tickerWrap{background:#1a1a2e;padding:10px 0;overflow:hidden;white-space:nowrap;border-top:3px solid #cc0000;}
    .ticker{display:inline-block;animation:scroll 25s linear infinite;}
    @keyframes scroll{0%{transform:translateX(100vw);}100%{transform:translateX(-100%);}}
    .ticker span{color:#ddeeff;font-size:1.1rem;margin-right:60px;}
    .ticker .sep{color:#cc0000;font-weight:900;margin-right:60px;}
    .stationLogo{position:absolute;bottom:20px;right:30px;color:#334466;font-size:0.9rem;font-weight:700;letter-spacing:3px;}
  </style>
</head>
<body>
  <div class="breakingBar"><h1>BREAKING NEWS</h1></div>
  <div class="mainContent">
    <div class="liveTag">LIVE</div>
    <div class="timestamp" id="clock"></div>
    <div class="headline" id="headline"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="stationLogo">SCREEN NEWS NETWORK</div>
  </div>
  <div class="tickerWrap"><div class="ticker" id="ticker"></div></div>
<script>
var headlines=[
  {h:"BREAKING: <span class=\"name\">90-MIN 'QUICK SYNC'</span> COULD HAVE BEEN AN EMAIL",s:"Calendar denies everything. Lunch is missing. Again."},
  {h:"<span class=\"name\">47 INVITED. 0 DECISIONS.</span> TEAMS DECLARES SUCCESS",s:"Follow-up booked. Optional, but come."},
  {h:"SHOCK: <span class=\"name\">THE CALENDAR ATE LUNCH</span> AND CALLED IT ALIGNMENT",s:"Kitchen reports: bricks unguarded. Screen on patrol."},
  {h:"<span class=\"name\">PRINTER</span> PRINTS ONE SLIDE FORTY TIMES",s:"Statement: \"You don't read email. I make paper.\""},
  {h:"LIVE: <span class=\"name\">AGENDA 404</span> IN CONFERENCE B",s:"PowerPoint has 40 slides and one point: none"},
  {h:"<span class=\"name\">OPTIONAL MEETING</span> ATTENDED BY EVERYONE",s:"As optional as a fire drill. Rec is on."},
  {h:"BREAKING: <span class=\"name\">PC LOAD LETTER</span> TRANSLATED: NO",s:"Printer union: paper jam is official policy"},
  {h:"<span class=\"name\">FINAL_v12_RIKTIG.xlsx</span> CAUGHT LYING IN THE FILENAME",s:"Excel VLOOKUP found nothing. Same as the agenda."},
  {h:"<span class=\"name\">THE SCREEN (GUEST)</span> WAS ALREADY THE HOST",s:"Muted. Still running the room. 60 Hz of judgment."},
  {h:"BREAKING: <span class=\"name\">THIS MEETING</span> PREMIERES HDMI: THE MUSICAL",s:"Act 1: a cable. Act 2: still a cable. Coffee machine walks out."},
  {h:"<span class=\"name\">FRIDAY MEETINGS</span> DECLARED A FELONY",s:"Ol-vagn is sacred. Calendar is not the law."},
  {h:"SHOCK: <span class=\"name\">COMIC SANS</span> FOUND IN AN INVOICE",s:"Fire department called. Too late. Printer on strike."},
  {h:"<span class=\"name\">SCREEN + PRINTER</span> BOOK CLUB READS THE BUDGET",s:"First book: empty 90-page PDF named PDF. Reviews: five jams"},
  {h:"WEATHER: 100% CHANCE OF <span class=\"name\">FIKA</span>, SCATTERED POWERPOINTS",s:"Meetings over lunch: criminal. Bring a mug, not a slide."},
  {h:"SPORTS: <span class=\"name\">OL-VAGN</span> UNDEFEATED. FRIDAY STANDUPS: 0-14",s:"The screen is mascot. The mascot can HDMI. The mascot cannot clap."},
  {h:"CULTURE: <span class=\"name\">SYNERGY</span> TRANSLATED TO DANISH",s:"Result: synergy. Invoice anyway. Paid in kanelbullar."},
  {h:"<span class=\"name\">DECAF</span> DETECTED IN THE SECTOR",s:"Evacuation recommended. Meeting stayed. Meeting lost."},
  {h:"SCIENCE: OFFICE 14% FASTER WHEN <span class=\"name\">MEETINGS ARE EMAIL</span>",s:"Peer review by the candy bowl. Candy bowl ate the minutes."},
  {h:"POLICE: <span class=\"name\">CAN YOU HEAR ME</span> SAID FOR THE THIRD TIME",s:"Everyone is muted. Nobody has a decision. Rec is still on."},
  {h:"<span class=\"name\">INFO SCREEN</span> ELECTED MAYOR OF ROOM B",s:"Law 1: fika. Law 2: Comic Sans is a felony. Law 3: send the email."}
];
var tickerItems=[
  "BREAKING: 90-min quick sync could have been an email - calendar eating lunch again",
  "LIVE: 47 invited, 0 decisions, follow-up already booked",
  "Printer printed one slide forty times. Quote: you don't read email",
  "Agenda 404 in conference B. PowerPoint: 40 slides, 0 points",
  "Optional meeting attended by everyone. Rec is on. Of course it is",
  "PC LOAD LETTER officially translated: no",
  "FINAL_v12_RIKTIG.xlsx caught lying in the filename",
  "Screen (Guest) was already the host. Muted. Running the room anyway",
  "Friday meetings declared a felony. Ol-vagn still undefeated",
  "Comic Sans found in an invoice. Fire department too late",
  "Screen and printer book club: the budget. Reviews: five paper jams",
  "Synergy translated to Danish: synergy. Invoice anyway",
  "Decaf detected. Evacuation recommended. Meeting stayed",
  "Can you hear me said three times. Nobody has a decision",
  "Calendar ate lunch and called it alignment",
  "HDMI The Musical in room B. Coffee machine walked out",
  "Fika is law. Meetings over lunch are not",
  "Excel VLOOKUP found nothing. Same as the agenda",
  "Weather: 100% fika, scattered PowerPoints, isolated paper jams",
  "Info screen elected mayor of room B. First law: send the email"
];

var tickerEl=document.getElementById("ticker"),tickerHTML="";
for(var i=0;i<3;i++){for(var j=0;j<tickerItems.length;j++){
  tickerHTML+="<span>"+tickerItems[j]+"</span><span class=\"sep\">+++</span>";
}}
tickerEl.innerHTML=tickerHTML;

function updateClock(){
  var now=new Date();var h=String(now.getHours()).padStart(2,"0");
  var m=String(now.getMinutes()).padStart(2,"0");
  var s=String(now.getSeconds()).padStart(2,"0");
  document.getElementById("clock").textContent=h+":"+m+":"+s;
}
setInterval(updateClock,1000);updateClock();

var idx=0,hlEl=document.getElementById("headline"),stEl=document.getElementById("subtitle");
function showHeadline(){
  hlEl.classList.remove("visible");stEl.classList.remove("visible");
  setTimeout(function(){
    hlEl.innerHTML=headlines[idx].h;stEl.innerHTML=headlines[idx].s;
    hlEl.classList.add("visible");stEl.classList.add("visible");
    idx=(idx+1)%headlines.length;
  },800);
}
showHeadline();setInterval(showHeadline,6000);
</script>
</body>
</html>
