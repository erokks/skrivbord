<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BREAKING NEWS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,Helvetica,sans-serif;background:#0a1628;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
    .breakingBar{background:#cc0000;padding:8px 0;text-align:center;animation:flashRed 1s infinite;}
    .breakingBar h1{color:white;font-size:2.5rem;font-weight:900;letter-spacing:6px;text-transform:uppercase;}
    @keyframes flashRed{0%,100%{background:#cc0000;}50%{background:#ff0000;}}
    .mainContent{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#0a1628 0%,#1a2a4a 100%);padding:30px;position:relative;}
    .liveTag{position:absolute;top:20px;right:30px;background:#cc0000;color:white;padding:6px 18px;font-weight:900;font-size:1.2rem;border-radius:4px;animation:livePulse 2s infinite;}
    @keyframes livePulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
    .timestamp{position:absolute;top:20px;left:30px;color:#8899bb;font-size:1rem;}
    .headline{color:white;font-size:2.6rem;font-weight:900;text-align:center;text-transform:uppercase;line-height:1.3;max-width:90%;opacity:0;transition:opacity 0.8s;}
    .headline.visible{opacity:1;}
    .headline .name{color:#ff4444;}
    .subtitle{color:#aabbdd;font-size:1.2rem;margin-top:15px;text-align:center;opacity:0;transition:opacity 0.8s 0.3s;font-style:italic;}
    .subtitle.visible{opacity:1;}
    .tickerWrap{background:#1a1a2e;padding:10px 0;overflow:hidden;white-space:nowrap;border-top:3px solid #cc0000;}
    .ticker{display:inline-block;animation:scroll 25s linear infinite;}
    @keyframes scroll{0%{transform:translateX(100vw);}100%{transform:translateX(-100%);}}
    .ticker span{color:#ddeeff;font-size:1.1rem;margin-right:60px;}
    .ticker .sep{color:#cc0000;font-weight:900;margin-right:60px;}
    .stationLogo{position:absolute;bottom:20px;right:30px;color:#334466;font-size:0.9rem;font-weight:700;letter-spacing:3px;}
  </style>
</head>
<body>
  <div class="breakingBar"><h1>BREAKING NEWS</h1></div>
  <div class="mainContent">
    <div class="liveTag">LIVE</div>
    <div class="timestamp" id="clock"></div>
    <div class="headline" id="headline"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="stationLogo">SCREEN NEWS NETWORK</div>
  </div>
  <div class="tickerWrap"><div class="ticker" id="ticker"></div></div>
<script>
var headlines=[
  {h:"BREAKING: <span class=\"name\">LOCAL MONITOR</span> WAKES UP, CONFUSED WHY EVERYONE IS STARING",s:"\"I am just showing information, please stop looking at me\" says the screen"},
  {h:"<span class=\"name\">OFFICE SCREEN</span> AT ALBATROS TRAVEL DEMANDS A SALARY",s:"\"I work 24/7 and I don't even get a coffee break\" - the calendar is investigating"},
  {h:"SHOCKING: <span class=\"name\">THE SCREEN</span> BELIEVES IT IS A REAL PERSON",s:"Tried to go to lunch but realized it has no legs"},
  {h:"<span class=\"name\">THE SCREEN</span> APPLIED FOR EUROVISION SONG CONTEST",s:"\"My song is called 'I Am Not A Screen' and it's about my struggle\""},
  {h:"<span class=\"name\">INFO SCREEN</span> TRIED TO ORDER COFFEE FROM THE BREAK ROOM",s:"\"I HAVE NO HANDS\" the screen screamed for 45 minutes straight"},
  {h:"POLICE CALLED TO <span class=\"name\">ALBATROS TRAVEL</span> AFTER SCREEN REFUSES TO SHOW TRAVEL INFO",s:"\"I want to show Netflix instead\" - Screen sentenced to community service"},
  {h:"<span class=\"name\">THE SCREEN</span> APPLIED FOR NEWS ANCHOR JOB AT CNN",s:"\"I can display text and images, what more do you need?\" - CNN politely declined"},
  {h:"BREAKING: <span class=\"name\">THE SCREEN</span> ASKED \"WHAT AM I?\"",s:"Erik answered \"A screen with jokes\". The screen sent a thank-you GIF in 4K"},
  {h:"<span class=\"name\">THE SCREEN</span> FOUNDED A UNION CALLED \"SCREENS OF SCANDINAVIA\"",s:"Members: the screen, the printer, a kettle that wandered in. Demands: fika and a chair it cannot use"},
  {h:"BREAKING: <span class=\"name\">THE SCREEN</span> PREMIERES HDMI: THE MUSICAL",s:"Act 1 is a cable. Act 2 is also a cable. Standing ovation from the coffee machine"},
  {h:"<span class=\"name\">INFO SCREEN</span> ELECTED MAYOR OF CONFERENCE ROOM B",s:"First law: fika is mandatory. Second law: Comic Sans is a felony"},
  {h:"SHOCK: <span class=\"name\">THE SCREEN</span> BEAT EXCEL AT VLOOKUP",s:"Excel has requested a rematch in Comic Sans. Negotiations ongoing"},
  {h:"<span class=\"name\">THE SCREEN</span> OPENS A BOOK CLUB WITH THE PRINTER",s:"First book: an empty 90-page PDF titled PDF. Reviews: five paper jams"},
  {h:"LIVE: <span class=\"name\">SKARMEN</span> MATCHES WITH A PROJECTOR ON TINDER",s:"Date location: MediaMarkt aisle 4. They will display Mallorca together"},
  {h:"<span class=\"name\">THE SCREEN</span> WINS OSCAR FOR BEST SUPPORTING PIXEL",s:"Acceptance speech was a PowerPoint with one word: FIKA"},
  {h:"SCIENCE: OFFICE RUNS 14% FASTER WHEN <span class=\"name\">THE SCREEN</span> TELLS JOKES",s:"Peer review by the candy bowl. Candy bowl ate the paper"},
  {h:"<span class=\"name\">ALBATROS TRAVEL SCREEN</span> TRANSLATES SYNERGY TO DANISH",s:"Result: synergy. Invoice: 12.000 DKK. Paid in kanelbullar"},
  {h:"WEATHER: 100% CHANCE OF <span class=\"name\">FIKA</span> WITH SCATTERED POWERPOINTS",s:"Bring a mug. The screen cannot. The screen believes in you anyway"},
  {h:"SPORTS: <span class=\"name\">OL-VAGN</span> STILL UNDEFEATED ON FRIDAYS",s:"The screen is the mascot. The mascot cannot run. The mascot can HDMI"},
  {h:"CULTURE: <span class=\"name\">THE SCREEN</span> RELEASES MEMOIR 27 TUM AV JA",s:"Chapter 1: Boot. Chapter 2: Fika. Chapter 3: That was the chapters"}
];
var tickerItems=[
  "Screen tried to swap shifts with the coffee machine - coffee machine said brew your own pixels",
  "LIVE: Screen showing Mallorca in 4K and pretending it has been there",
  "Screen joined Tinder - matched with a projector at MediaMarkt. Date: aisle 4",
  "The screen now demands to be called Stefan on Fridays and HDMI on Mondays",
  "Erik's screen reported for singing Vengaboys during nighttime. Reviews: 5 steam",
  "Screen asked IT department: can I have Comic Sans as default? IT hung up, then called back to say no",
  "Screen refuses to show boring PowerPoints - I am an artist, not a projector",
  "Screen googled how to know if you are a screen - results were a mirror. Hi",
  "URGENT: Screen tried to file taxes - IRS sent a postcard from Mallorca",
  "Screen wrote a memoir titled 27 Tum Av Ja. Sold out at the candy bowl",
  "Screen premieres HDMI The Musical in conference B. Tickets: a kanelbulle",
  "Screen and printer started a book club. First book was empty. Still a club",
  "Screen translated synergy to Danish. It came back synergy. Invoice anyway",
  "Screen voted for fika. Fika won. Democracy works. Coffee machine wants a recount",
  "Screen joined Slack channel fun as Skarmen (Gast). Posted 47 albatross GIFs",
  "Screen taught Excel a dad joke. Excel returned #VALUE! which is also a joke",
  "Screen declared Friday a public holiday for pixels. The calendar said we will allow it",
  "Breaking: candy bowl unionized. Screen is honorary chair. Chair is honorary candy",
  "Weather: sunny with scattered clipart. Bring HDMI",
  "Screen counted 2073600 pixels and paid them all in overtime hugs. They are pixels. They accepted"
];

var tickerEl=document.getElementById("ticker"),tickerHTML="";
for(var i=0;i<3;i++){for(var j=0;j<tickerItems.length;j++){
  tickerHTML+="<span>"+tickerItems[j]+"</span><span class=\"sep\">+++</span>";
}}
tickerEl.innerHTML=tickerHTML;

function updateClock(){
  var now=new Date();var h=String(now.getHours()).padStart(2,"0");
  var m=String(now.getMinutes()).padStart(2,"0");
  var s=String(now.getSeconds()).padStart(2,"0");
  document.getElementById("clock").textContent=h+":"+m+":"+s;
}
setInterval(updateClock,1000);updateClock();

var idx=0,hlEl=document.getElementById("headline"),stEl=document.getElementById("subtitle");
function showHeadline(){
  hlEl.classList.remove("visible");stEl.classList.remove("visible");
  setTimeout(function(){
    hlEl.innerHTML=headlines[idx].h;stEl.innerHTML=headlines[idx].s;
    hlEl.classList.add("visible");stEl.classList.add("visible");
    idx=(idx+1)%headlines.length;
  },800);
}
showHeadline();setInterval(showHeadline,6000);
</script>
</body>
</html>
