<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSOD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0078d7; color: white; font-family: "Segoe UI", Arial, sans-serif;
      height: 100vh; display: flex; flex-direction: column; justify-content: center;
      align-items: center; padding: 60px; overflow: hidden; }
    .sad { font-size: 8rem; margin-bottom: 30px; }
    .title { font-size: 1.8rem; margin-bottom: 15px; }
    .info { font-size: 1.1rem; color: #cce0ff; margin-bottom: 8px; max-width: 700px; }
    .percent { font-size: 1.3rem; margin-top: 30px; margin-bottom: 20px; }
    .qr { width: 100px; height: 100px; background: white; margin: 20px 0;
      display: flex; align-items: center; justify-content: center; }
    .qr-inner { width: 80px; height: 80px;
      background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0/10px 10px; }
    .stopcode { font-size: 0.9rem; color: #99c2ff; margin-top: 15px; font-family: monospace; }
    .details { font-size: 0.85rem; color: #80b3ff; margin-top: 8px;
      font-family: monospace; max-width: 700px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="sad">:(</div>
  <div class="title">Din dator fick ett problem och maste startas om.</div>
  <div class="info">Vi samlar bara in felinformation, sen startar vi om datorn at dig.</div>
  <div class="percent" id="pct">0% klart</div>
  <div style="display:flex;align-items:flex-start;gap:20px;margin-top:10px;">
    <div class="qr"><div class="qr-inner"></div></div>
    <div>
      <div class="stopcode" id="stopcode"></div>
      <div class="details" id="details"></div>
    </div>
  </div>
<script>
var errors = [
  {stop:"MEETING_SHOULD_BE_EMAIL",detail:"KALENDER.SYS bokade 90 min 'kort avstamning'. AGENDA.DLL returnerar 404. Rekommendation: skicka mejlet. Fortsatt inte."},
  {stop:"OPTIONAL_BUT_COME",detail:"Mote flaggat optional. 47 anslöt. REC.EXE ar pa. Sa optional som en brandovning."},
  {stop:"CALENDAR_ATE_LUNCH",detail:"LUNCH.SYS saknas. KALENDER.EXE at den och kallade det alignment. Koksrapport: brickor obevaktade."},
  {stop:"SLIDE_X40_PRINTED",detail:"En (1) slide i SPOOLER. 40 kopior ute. SKRIVAREN.SYS: ni laser inte mejl. Papper ar min kanal."},
  {stop:"AGENDA_404",detail:"Windows kan inte hitta AGENDA.DLL. PowerPoint har 40 slides och 0 poang. Clipart: 1 albatross."},
  {stop:"PC_LOAD_LETTER",detail:"Skrivaren oversatte 1998 till svenska: NEJ. Pappersstopp ar officiell policy. Las mejlet."},
  {stop:"FINAL_V12_LIE",detail:"Filen Budget_FINAL_v12_RIKTIG.xlsx ljuger i namnet. VLOOKUP hittade inget. Precis som agendan."},
  {stop:"COMIC_SANS_DETECTED",detail:"Typsnittet vaknade i en faktura. Brandkar tillkallat. Skrivaren strejkar. HDMI skriker i 60 Hz."},
  {stop:"MUTED_AGAIN",detail:"TEAMS.EXE: kan ni hora mig x3. 47 inne. 0 beslut. REC pa. Skarmen (Gast) kor rummet anda."},
  {stop:"FRIDAY_MEETING_FAULT",detail:"VECKODAG.SYS vagrar moten pa fredag. OL_VAGN.DLL ar helig. Felkod: 0xF4IDAG."},
  {stop:"DECAF_IN_SECTOR",detail:"KAFFE.SYS larm. Evakuering rekommenderas. Motet stannade. Motet forlorade."}
];
var err = errors[Math.floor(Math.random()*errors.length)];
document.getElementById("stopcode").textContent = "Stoppkod: "+err.stop;
document.getElementById("details").textContent = err.detail;
var pct=0, pctEl=document.getElementById("pct");
var iv = setInterval(function(){
  pct += Math.floor(Math.random()*3)+1;
  if(pct>100) pct=100;
  pctEl.textContent = pct+"% klart";
  if(pct>=100){ clearInterval(iv);
    setTimeout(function(){document.body.style.transition="opacity 1s";document.body.style.opacity="0";},2000);
  }
},800);
</script>
</body>
</html>
