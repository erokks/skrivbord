<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FREDAG</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(ellipse at center,#4a3000 0%,#1a0a00 80%);color:#ffcc44;font-family:'Impact','Arial Black',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;position:relative}.status{position:absolute;top:16px;left:30px;color:#ffaa00;font-size:1rem;letter-spacing:2px;z-index:5}.day-tag{position:absolute;top:16px;right:30px;background:#ff2c5c;color:#fff;padding:6px 16px;font-size:1rem;letter-spacing:3px;font-weight:900;animation:pulse 1.2s infinite;z-index:5}@keyframes pulse{50%{opacity:.6}}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:2;position:relative}.label{font-size:1.8rem;color:#ffaa00;letter-spacing:8px;margin-bottom:10px;text-shadow:0 0 20px rgba(255,170,0,.5);text-align:center}.cd{font-size:11rem;font-weight:900;color:#ffd700;line-height:1;letter-spacing:6px;text-shadow:0 0 40px rgba(255,215,0,.7)}.cd.hot{color:#ff8800;animation:shake .3s infinite}.cd.party{color:#88ff44;animation:bigBounce .5s infinite}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes bigBounce{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.15) rotate(2deg)}}.joke{font-size:2.5rem;color:#fff;font-weight:900;text-shadow:0 0 25px rgba(255,255,0,.5);margin-top:20px;text-align:center;max-width:90%;animation:fadeUp 1s}@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.shower{position:fixed;inset:0;pointer-events:none;z-index:1}.bemo{position:absolute;font-size:2.5rem;animation:fall 5s linear infinite;font-family:Arial,sans-serif;font-weight:900}@keyframes fall{0%{transform:translateY(-100px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}.ticker-wrap{background:#000;padding:14px 0;border-top:3px solid #ffcc44;overflow:hidden;white-space:nowrap;z-index:3}.ticker{display:inline-block;animation:scroll 38s linear infinite;color:#ffcc44;font-size:1.3rem;letter-spacing:2px}@keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}.cart{position:fixed;bottom:90px;left:-300px;font-size:5rem;font-weight:900;color:#ffd700;text-shadow:0 0 30px #ffd700;animation:driveBy 8s linear;z-index:6}@keyframes driveBy{from{left:-300px}to{left:100vw}}</style></head><body><div class="status" id="status"></div><div class="day-tag">FREDAG</div><div class="shower" id="shower"></div><div class="center"><div class="label" id="label">ÖLVAGNEN OM</div><div class="cd" id="cd">--:--:--</div><div class="joke" id="joke"></div></div><div class="ticker-wrap"><div class="ticker" id="ticker"></div></div><script>
/* Fredag: nedräkning till ölvagnen 14:00. Kort och elakt. */
var preJ=[
  "INGEN BOKAR MÖTEN PÅ FREDAGAR. UTOM NÅGON.",
  "STATUS: GRÖN. HJÄRNA: GUL.",
  "DET HÄR ÄR INTE ETT ARBETSPASS. DET ÄR EN VÄNTSAL.",
  "SVARA PÅ MEJL? JA. PÅ MÅNDAG.",
  "VECKANS VIKTIGASTE BESLUT: VILKEN ÖL.",
  "SKRIV 'FÅR KOLLA PÅ MÅNDAG'. SKICKA.",
  "FREDAG 08:58: 'SNABB FRÅGA'. NEJ.",
  "STÄNG INTE LAPTOPEN ÄN. SE UPPTAGEN UT.",
  "DU HAR TVÅ LÄGEN: FIKA OCH NEDRÄKNING.",
  "INGEN HAR NÅGONSIN GJORT NÅGOT VIKTIGT EFTER 11 PÅ EN FREDAG."
];
var nearJ=[
  "HÖR NI? DET KLIRRAR I KORRIDOREN.",
  "SPARA ALLT. STÄNG INGET. GÅ.",
  "SISTA MINUTERNA. ACCEPTERA INGA INBJUDNINGAR.",
  "OM NÅGON SÄGER 'EN SISTA GREJ': LÅTSAS FRYSA I TEAMS."
];
var celJ=[
  "ÖLVAGNEN ÄR HÄR. MÖTET ÄR INSTÄLLT. AV DIG.",
  "SKÅL FÖR ALLA MEJL DU INTE SVARADE PÅ.",
  "SKÅL. INKORGEN KAN VÄNTA. DEN ÄR VAN.",
  "TEAMS-STATUS: 'BORTA'. ÄRLIGT FÖR FÖRSTA GÅNGEN.",
  "DET HÄR ÄR VECKANS ENDA MÖTE MED BESLUT."
];
var postJ=[
  "ALLT DU SKICKAR NU LÄSES PÅ MÅNDAG. AV DIG.",
  "UTKAST SPARAT. SAMVETE OCKSÅ.",
  "HELGEN BÖRJAR NÄR LAPTOPEN STÄNGS. HELA LOCKET.",
  "MÅNDAG KL 9: 'HAR NI HAFT EN BRA HELG?' FÖRBERED ETT SVAR.",
  "SISTA PERSONEN SOM GÅR: SLÄCK. INGEN ÄR SISTA."
];
var tick=["FREDAG","Ölvagnen 14:00","Mötesfri fredag: tre möten","Snabb fråga? Måndag.","Utkast: 14. Skickade: 0.","Teams: gul hela dagen","Mejl efter 15 räknas som kultur","Någon har bokat 'Veckoavslut (30 min)'. Avböj.","Kaffemaskinen har redan helg"];
var t=document.getElementById("ticker"),th="";for(var x=0;x<3;x++)for(var y=0;y<tick.length;y++)th+='<span style="margin-right:60px">'+tick[y]+'</span><span style="color:#ffd700;margin-right:60px">🍺</span>';t.innerHTML=th;
var sh=document.getElementById("shower");
function rain(){var e=document.createElement("div");e.className="bemo";e.textContent=["🍺","🍻","🥨","FRE","🍺","SKÅL"][Math.floor(Math.random()*6)];e.style.left=Math.random()*100+"%";e.style.fontSize=(1.5+Math.random()*2)+"rem";e.style.animationDuration=(4+Math.random()*3)+"s";e.style.color=["#ffd700","#ffaa00","#ff6633","#ffcc44"][Math.floor(Math.random()*4)];sh.appendChild(e);setTimeout(function(){e.remove()},7500)}
setInterval(rain,500);
function spawnCart(){var c=document.createElement("div");c.className="cart";c.textContent="🍺🛒 ÖLVAGNEN 🛒🍺";document.body.appendChild(c);setTimeout(function(){c.remove()},8500)}
var jE=document.getElementById("joke");
function newJoke(arr){jE.textContent=arr[Math.floor(Math.random()*arr.length)];jE.style.animation="none";setTimeout(function(){jE.style.animation=""},20)}
function update(){
  var now=new Date(),hr=now.getHours(),mn=now.getMinutes(),sc=now.getSeconds();
  var diff=14*3600-(hr*3600+mn*60+sc);
  var cd=document.getElementById("cd"),label=document.getElementById("label"),status=document.getElementById("status");
  status.textContent="FREDAG "+String(hr).padStart(2,"0")+":"+String(mn).padStart(2,"0");
  cd.className="cd";
  if(diff>0){
    var hh=Math.floor(diff/3600),mm=Math.floor((diff%3600)/60),ss=diff%60;
    cd.textContent=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
    if(diff<300){label.textContent="DEN ÄR NÄRA. JAG HÖR HJULEN.";cd.className="cd hot"}else label.textContent="ÖLVAGNEN OM";
  }else if(diff>-3600){
    var emn=Math.floor(((-diff)%3600)/60),esc=(-diff)%60;
    label.textContent="ÖLVAGNEN HAR VARIT HÄR I";
    cd.textContent=String(emn).padStart(2,"0")+":"+String(esc).padStart(2,"0");
    cd.className="cd party";
    if(diff>-30&&!window._csh){window._csh=true;spawnCart();setTimeout(spawnCart,3000);setTimeout(spawnCart,6000)}
  }else{label.textContent="HELGEN OM";cd.textContent=Math.max(0,16-hr)+" H";cd.className="cd"}
}
update();setInterval(update,1000);
setInterval(function(){var now=new Date(),hr=now.getHours(),arr;if(hr<14)arr=preJ;else if(hr<15)arr=celJ;else arr=postJ;if(hr===13&&now.getMinutes()>55)arr=nearJ;newJoke(arr)},4500);
newJoke(new Date().getHours()<14?preJ:new Date().getHours()<15?celJ:postJ);
</script></body></html>
