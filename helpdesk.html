<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helpdesk – nu betjänas nummer</title>
  <style>
    body { background:#f4f4f4; color:#002647; font-family:"Segoe UI",Tahoma,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; overflow:hidden; }
    h1 { font-size:2.2rem; margin-bottom:12px; text-align:center; }
    .sub { color:#666; margin-bottom:24px; font-size:1.1rem; min-height:1.4em; text-align:center; }
    .display { background:#fff; border:5px solid #002647; border-radius:15px; padding:36px 70px; font-size:6rem; font-weight:bold; box-shadow:0 0 30px rgba(0,0,0,0.2); min-width:340px; text-align:center; }
    .blink { animation:blink 1s steps(2,start) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .footer { position:absolute; bottom:18px; font-size:0.95rem; color:#666; text-align:center; width:90%; }
    .error { margin-top:24px; padding:16px 22px; background:#ffe6e6; color:#a80000; border:3px dashed #a80000; border-radius:10px; font-size:1.25rem; display:none; text-align:center; max-width:80%; }
    .ticker { position:absolute; top:0; left:0; right:0; background:#002647; color:#fff; padding:8px 0; overflow:hidden; white-space:nowrap; font-weight:700; }
    .ticker span { display:inline-block; padding-left:100%; animation:t 22s linear infinite; }
    .qr { width:110px; height:110px; margin-top:30px; background:#fff; border:8px solid #fff; box-shadow:0 0 0 2px #002647; background-image:repeating-conic-gradient(#002647 0% 25%, #fff 0% 50%); background-size:22px 22px; }
    .qrcap { font-size:.95rem; color:#666; margin-top:6px; }
    @keyframes t { 100%{transform:translateX(-100%)} }
  </style>
</head>
<body>
  <div class="ticker"><span>NU BETJÄNAS • HAR DU PROVAT ATT STARTA OM? • DIN FRÅGA ÄR VIKTIG FÖR OSS • DU ÄR NUMMER 41 I KÖN • KÖN ÄR OCKSÅ NUMMER 41 • </span></div>
  <h1 id="headline">Helpdesk – nu betjänas nummer</h1>
  <div class="sub" id="sub">Har du provat att starta om?</div>
  <div class="display" id="numberDisplay">001</div>
  <div class="error" id="errorBox">Systemfel. Ta en ny lapp.</div>
  <div class="qr" aria-hidden="true"></div><div class="qrcap">Skanna för att hamna längre bak i kön</div>
  <div class="footer" id="footer">Beräknad väntetid: ja.</div>
<script>
const display = document.getElementById("numberDisplay");
const errorBox = document.getElementById("errorBox");
const sub = document.getElementById("sub");
const footer = document.getElementById("footer");
let currentNumber = 1;
const wild = ["???","∞","−3","π","A4","NEJ","LUNCH","STARTA OM","1/2","42"];
const subs = [
  "Har du provat att starta om?",
  "Har du provat att starta om ordentligt?",
  "Nej, inte bara skärmen.",
  "Har du provat att dra ur sladden? Inte den. Den andra.",
  "Ditt ärende har eskalerats. Till samma person.",
  "Vi har tagit emot din fråga. Den ligger nu i en mapp som heter 'Senare'.",
  "Nummer 000 gick på lunch 2019."
];
const errs = [
  "Systemfel. Ta en ny lapp.",
  "Din lapp har gått ut. Den var giltig i 4 sekunder.",
  "Lappen hittades inte. Har du provat att starta om den?",
  "Ärendet stängt: 'Löst av sig själv'. Det har det inte.",
  "Numret du väntar på har bytt jobb."
];
const foots = [
  "Beräknad väntetid: ja.",
  "Ditt samtal är viktigt för oss. Inte jätteviktigt. Men viktigt.",
  "Tips: säg 'det funkade nyss' när teknikern kommer. Då funkar det.",
  "Lucka 3 finns inte. Har aldrig funnits."
];
function formatNumber(num) { return num.toString().padStart(3, "0"); }
function updateNumber() {
  if (Math.random() < 0.22) {
    display.textContent = wild[Math.floor(Math.random()*wild.length)];
  } else {
    let change = Math.floor(Math.random() * 5);
    if (Math.random() < 0.25) {
      if (Math.random() < 0.5) currentNumber -= Math.floor(Math.random() * 15);
      else currentNumber += Math.floor(Math.random() * 900 + 100);
    } else currentNumber += change;
    if (currentNumber < 1) currentNumber = 1;
    if (currentNumber > 999) currentNumber = Math.floor(Math.random() * 50) + 1;
    display.textContent = formatNumber(currentNumber);
  }
  display.classList.add("blink");
  setTimeout(() => display.classList.remove("blink"), 800);
  if (Math.random() < 0.35) sub.textContent = subs[Math.floor(Math.random()*subs.length)];
  if (Math.random() < 0.25) footer.textContent = foots[Math.floor(Math.random()*foots.length)];

  if (Math.random() < 0.12) {
    errorBox.textContent = errs[Math.floor(Math.random()*errs.length)];
    errorBox.style.display = "block";
    setTimeout(() => { errorBox.style.display = "none"; }, 2800);
  }
  if (Math.random() < 0.06) {
    document.body.style.backgroundColor = "#002647";
    document.body.style.color = "#ffcc00";
    document.getElementById("headline").textContent = "PAUS. HELPDESK STARTAR OM.";
    setTimeout(() => {
      document.body.style.backgroundColor = "#f4f4f4";
      document.body.style.color = "#002647";
      document.getElementById("headline").textContent = "Helpdesk – nu betjänas nummer";
    }, 3500);
  }
  setTimeout(updateNumber, Math.random() * 2800 + 900);
}
setTimeout(updateNumber, 1200);
</script>
</body>
</html>
