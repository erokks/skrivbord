    #toasts{position:fixed;right:16px;bottom:52px;z-index:8020;display:none;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;}

    /* ===== GTA MODE ===== */
    #gtaOverlay{position:fixed;inset:0;z-index:10050;display:none;overflow:hidden;background:rgba(8,8,8,.12);}
    #gtaOverlay.on{display:block;}
    #gtaOverlay.sirens{background:rgba(0,0,0,.38);}
    #gtaOverlay.shake{animation:gtaShake .12s linear;}
    @keyframes gtaShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-5px,4px)}80%{transform:translate(6px,2px)}}
    #gtaFog{position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.07),transparent 42%,rgba(0,0,0,.18));pointer-events:none;}
    #gtaHoles{position:absolute;inset:0;pointer-events:none;}
    .gta-hole{position:absolute;border-radius:50%;opacity:0;transform:scale(.15);
      background:radial-gradient(circle at 34% 30%,#5a5a5a 0 6%,#1a1a1a 14%,#000 52%,#2a2a2a 66%,transparent 71%);

    .gta-hole.pop{animation:holePop .16s ease-out forwards;}
    @keyframes holePop{0%{opacity:0;transform:scale(.15)}45%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
    .gta-flash{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,#fff 0%,#ffe8a0 22%,rgba(255,160,40,.5) 42%,transparent 70%);opacity:0;mix-blend-mode:screen;}
    .gta-flash.go{animation:gtaFlash .28s ease-out forwards;}
    @keyframes gtaFlash{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
    .gta-crack{position:absolute;height:2px;transform-origin:0 50%;opacity:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(230,230,230,.95),rgba(180,180,180,.45),transparent);
      box-shadow:0 0 4px rgba(255,255,255,.6);}
    .gta-crack.go{animation:crackIn .22s ease-out forwards;}
    @keyframes crackIn{from{opacity:0;width:0}to{opacity:.9}}
    #gtaBezL,#gtaBezR,#gtaBezT,#gtaBezB{position:absolute;opacity:0;pointer-events:none;}
    #gtaBezL{left:0;top:0;bottom:0;width:70px;background:linear-gradient(90deg,rgba(220,0,20,.7),transparent);}
    #gtaBezR{right:0;top:0;bottom:0;width:70px;background:linear-gradient(270deg,rgba(20,70,255,.7),transparent);}
    #gtaBezT{top:0;left:0;right:0;height:46px;background:linear-gradient(180deg,rgba(220,0,20,.45),transparent);}
    #gtaBezB{bottom:0;left:0;right:0;height:46px;background:linear-gradient(0deg,rgba(20,70,255,.45),transparent);}
    #gtaOverlay.sirens #gtaBezL,#gtaOverlay.sirens #gtaBezT{opacity:1;animation:copR .38s infinite alternate;}
    #gtaOverlay.sirens #gtaBezR,#gtaOverlay.sirens #gtaBezB{opacity:1;animation:copB .38s infinite alternate;}
    @keyframes copR{0%{opacity:.15}100%{opacity:1}}
    @keyframes copB{0%{opacity:1}100%{opacity:.15}}
    #gtaCineT,#gtaCineB{position:absolute;left:0;right:0;height:0;background:#000;z-index:3;transition:height .45s ease;}
    #gtaCineT{top:0;}#gtaCineB{bottom:0;}
    #gtaOverlay.bars #gtaCineT,#gtaOverlay.bars #gtaCineB{height:78px;}
    #gtaWantedBox{position:absolute;top:92px;right:48px;z-index:4;text-align:right;opacity:0;transition:opacity .3s;}
    #gtaOverlay.stars #gtaWantedBox{opacity:1;}
    #gtaWantedLabel{font-family:Impact,'Arial Black',sans-serif;font-size:1.05rem;letter-spacing:8px;color:#ffd200;text-shadow:0 0 12px #f80,2px 2px 0 #000;}
    #gtaStars{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
    #gtaStars span{font-size:2.7rem;line-height:1;color:#2a2a2a;text-shadow:0 0 0 transparent;transform:scale(.85);transition:all .18s;}
    #gtaStars span.on{color:#ffd200;text-shadow:0 0 10px #ff0,0 0 22px #f80,2px 2px 0 #000;transform:scale(1.15);}
    #gtaSting{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;}
    #gtaSting.show{animation:stingIn .4s cubic-bezier(.2,1.3,.3,1) forwards;}
    @keyframes stingIn{0%{opacity:0;transform:scale(3.2) rotate(-10deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
    #gtaSting .big{font-family:Impact,'Arial Black',sans-serif;font-size:8.5rem;letter-spacing:14px;color:#c10;line-height:1;
      text-shadow:5px 5px 0 #000,-3px -3px 0 #000,0 0 40px #000,8px 8px 0 #400;}
    #gtaSting .sub{font-family:Impact,'Arial Black',sans-serif;font-size:2.2rem;letter-spacing:10px;color:#fff;margin-top:8px;text-shadow:3px 3px 0 #000;}

    #gtaRadio.show{animation:radioIn .35s ease-out forwards;}
    @keyframes radioIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    #smashWhite{position:fixed;inset:0;z-index:10060;background:#fff;display:none;}

    /* ===== VEGAS SLOT ===== */
    #vegasOverlay{position:fixed;inset:0;z-index:10050;display:none;overflow:hidden;background:#000;opacity:0;}

    #vegasOverlay.flood{animation:vegasFlood .85s ease-out forwards;}

    #vegasLights{position:absolute;inset:0;pointer-events:none;z-index:2;}

    #vegasFrame{position:absolute;inset:28px;z-index:3;border:12px solid #d4af37;border-radius:22px;

    #vegasTitle{font-family:Impact,'Arial Black',sans-serif;font-size:3.4rem;letter-spacing:10px;color:#ffd200;margin-top:6px;
      text-shadow:0 0 18px #ff0,0 0 40px #f80,4px 4px 0 #400;opacity:0;}
    #vegasOverlay.flood #vegasTitle{animation:neonFlicker 1.2s ease-out forwards;}
    @keyframes neonFlicker{0%,10%,18%{opacity:0}12%,16%,22%{opacity:.4}30%{opacity:1}40%{opacity:.2}48%,100%{opacity:1}}
    #vegasSub{color:#f8c;letter-spacing:4px;font-size:.85rem;margin:4px 0 14px;opacity:.85;}
    #vegasReels{display:flex;gap:18px;transform:translateY(-90px) scale(.35);opacity:0;}
    #vegasOverlay.slam #vegasReels{animation:reelSlam .5s cubic-bezier(.15,1.45,.35,1) forwards;}
    @keyframes reelSlam{0%{transform:translateY(-90px) scale(.35);opacity:0}72%{transform:translateY(14px) scale(1.05);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
    .vegas-window{width:170px;height:180px;overflow:hidden;background:#0a0a0a;border:7px solid #d4af37;border-radius:10px;
      box-shadow:inset 0 0 24px #000,0 0 18px rgba(255,200,0,.35);position:relative;}
    .vegas-window:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0008,#0000 18% 82%,#0008);z-index:2;}
    .vegas-strip{will-change:transform;}
    .vegas-cell{height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
    .vegas-cell span{font-size:4.6rem;line-height:1;filter:drop-shadow(0 4px 0 #000);}
    .vegas-cell small{margin-top:6px;font-size:.72rem;letter-spacing:2px;color:#d4af37;}
    #vegasSpinBtn{margin-top:16px;font-family:Impact,'Arial Black',sans-serif;font-size:2.1rem;letter-spacing:8px;color:#111;background:linear-gradient(#ffe566,#c90);
      padding:8px 48px;border-radius:8px;border:3px solid #fff2;box-shadow:0 6px 0 #840,0 0 20px #ff0;opacity:0;}
    #vegasOverlay.slam #vegasSpinBtn{opacity:1;animation:spinPulse .7s ease-in-out infinite alternate;}
    @keyframes spinPulse{from{transform:scale(1);box-shadow:0 6px 0 #840,0 0 16px #ff0}to{transform:scale(1.06);box-shadow:0 6px 0 #840,0 0 36px #fff}}
    #vegasPay{margin-top:12px;color:#fc8;letter-spacing:2px;font-size:.9rem;}
    #vegasResult{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;}
    #vegasResult.show{animation:vegasWin .45s cubic-bezier(.2,1.3,.3,1) forwards;}
    @keyframes vegasWin{0%{opacity:0;transform:scale(.4) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
    #vegasResult .jack{font-family:Impact,'Arial Black',sans-serif;font-size:6.2rem;letter-spacing:8px;color:#ffd200;
      text-shadow:0 0 20px #ff0,0 0 50px #f80,5px 5px 0 #400;}
    #vegasResult .prize{font-size:2rem;color:#fff;letter-spacing:3px;margin-top:8px;text-shadow:3px 3px 0 #000;background:rgba(0,0,0,.55);padding:8px 22px;}
    #vegasCoins{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden;}
    .vegas-coin{position:absolute;top:-40px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6a0,#e0b000 45%,#8a6a00);
      box-shadow:0 0 8px #fc0;animation:coinFall 1.4s linear forwards;}
    @keyframes coinFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:.85}}
  </style>

  o.connect(g);g.connect(ac.destination);

  var t0=ac.currentTime;
  var o1=ac.createOscillator(),g1=ac.createGain();
  o1.type="sawtooth";g1.gain.value=.07;o1.connect(g1);g1.connect(ac.destination);
  var o2=ac.createOscillator(),g2=ac.createGain();
  o2.type="square";g2.gain.value=.028;o2.connect(g2);g2.connect(ac.destination);
  for(var i=0;i<Math.ceil(dur/0.42)+2;i++){
    var a=i%2===0;
    o1.frequency.setValueAtTime(a?980:640,t0+i*.42);
    o1.frequency.linearRampToValueAtTime(a?640:980,t0+i*.42+.42);
    o2.frequency.setValueAtTime(a?780:560,t0+i*.42);
    o2.frequency.linearRampToValueAtTime(a?560:780,t0+i*.42+.42);
  }
  g1.gain.setValueAtTime(.07,t0);g1.gain.setValueAtTime(.07,t0+dur-.25);g1.gain.linearRampToValueAtTime(0,t0+dur);
  g2.gain.setValueAtTime(.028,t0);g2.gain.linearRampToValueAtTime(0,t0+dur);
  o1.start(t0);o2.start(t0);o1.stop(t0+dur);o2.stop(t0+dur);
  gtaSirenNodes.push(o1,o2);
}
function stingHit(){
  var ac=getAC();if(!ac)return;
  var t=ac.currentTime;
  [110,165,220].forEach(function(f,i){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type="sawtooth";o.frequency.value=f;g.gain.value=.09;
    o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
    o.start(t+i*.02);o.stop(t+.72);
  });
}
function slotClick(){
  var ac=getAC();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain();
  o.type="square";o.frequency.value=170+Math.random()*50;g.gain.value=.04;
  o.connect(g);g.connect(ac.destination);
  var t=ac.currentTime;
  g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);
  o.start(t);o.stop(t+.04);
}
function reelStopThud(){
  var ac=getAC();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.value=140;g.gain.value=.08;
  o.connect(g);g.connect(ac.destination);
  var t=ac.currentTime;
  o.frequency.exponentialRampToValueAtTime(70,t+.1);
  g.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.start(t);o.stop(t+.13);
}
function jackpotFanfare(){
  var ac=getAC();if(!ac)return;
  [523,659,784,1046,784,1046,1318,1568].forEach(function(f,i){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type="triangle";o.frequency.value=f;g.gain.value=.07;
    o.connect(g);g.connect(ac.destination);
    var t=ac.currentTime+i*.11;
    g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
    o.start(t);o.stop(t+.3);
  });
}
function nearMissWah(){
  var ac=getAC();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.value=440;g.gain.value=.06;
  o.connect(g);g.connect(ac.destination);
  var t=ac.currentTime;
  o.frequency.linearRampToValueAtTime(220,t+.4);
  g.gain.exponentialRampToValueAtTime(.001,t+.45);
  o.start(t);o.stop(t+.46);
}

function hideSideOvls(){
  ovlIds().forEach(function(id){
    var el=document.getElementById(id); if(!el)return;
    el.style.display="none"; el.innerHTML="";
  });
  var fg=document.getElementById("flashGag"); if(fg){fg.style.display="none";fg.innerHTML="";}
}
function startGta(){
  if(seqBusy)return;
  seqBusy=true;seqClear();getAC();hideSideOvls();setChrome(true);
  var ov=document.getElementById("gtaOverlay");
  var holes=document.getElementById("gtaHoles");
  holes.innerHTML="";
  document.getElementById("gtaSting").className="";
  document.getElementById("gtaRadio").className="";
  document.getElementById("gtaRadio").textContent="";
  var stars=document.querySelectorAll("#gtaStars span");
  for(var i=0;i<stars.length;i++)stars[i].className="";
  ov.className="on bars";
  ov.style.display="block";
  var specs=[
    {x:22,y:30,s:78,c:4},{x:57,y:16,s:56,c:3},{x:74,y:48,s:90,c:5},
    {x:40,y:62,s:64,c:3},{x:12,y:70,s:50,c:2},{x:83,y:28,s:68,c:3},
    {x:48,y:38,s:52,c:2},{x:66,y:76,s:72,c:4},{x:30,y:18,s:44,c:2}
  ];
  function punch(h){
    var d=document.createElement("div");
    d.className="gta-hole pop";
    d.style.left=h.x+"%";d.style.top=h.y+"%";
    d.style.width=d.style.height=h.s+"px";
    d.style.marginLeft=d.style.marginTop=(-h.s/2)+"px";
    holes.appendChild(d);
    var f=document.createElement("div");
    f.className="gta-flash go";
    f.style.left=h.x+"%";f.style.top=h.y+"%";
    holes.appendChild(f);
    for(var k=0;k<h.c;k++){
      var cr=document.createElement("div");
      cr.className="gta-crack go";
      var ang=(k/h.c)*360+Math.random()*38-8;
      var len=36+Math.random()*110;
      cr.style.left=h.x+"%";cr.style.top=h.y+"%";
      cr.style.width=len+"px";
      cr.style.transform="rotate("+ang+"deg)";
      holes.appendChild(cr);
    }
    ov.classList.remove("shake");void ov.offsetWidth;ov.classList.add("shake");
    thud();glassChip();
  }
  specs.forEach(function(h,i){seqLater(function(){punch(h)},220+i*310);});
  seqLater(function(){
    ov.classList.add("sirens");
    startSirens(12);
  }, 3100);
  seqLater(function(){
    ov.classList.add("stars");
    function fill(n){if(stars[n])stars[n].className="on";thud();}
    seqLater(function(){fill(0)},0);
    seqLater(function(){fill(1)},520);
    seqLater(function(){fill(2)},1040);
    seqLater(function(){fill(3)},1560);
    seqLater(function(){fill(4)},2100);
  }, 6400);
  seqLater(function(){
    document.getElementById("gtaStingBig").textContent="EFTERLYST";
    document.getElementById("gtaStingSub").textContent="WANTED  ★  5 STJÄRNOR";
    document.getElementById("gtaSting").className="show";
    stingHit();
  }, 9200);
  seqLater(function(){
    document.getElementById("gtaStingBig").textContent="FASTTAGEN";
    document.getElementById("gtaStingSub").textContent="SKÄRMEN ÄR PÅ VIFT";
    var r=document.getElementById("gtaRadio");
    r.textContent="Enhet 4, ett mote utan agenda ar pa vift. Upprepa: 90 minuter, optional, alla kom.";
    r.className="show";
    stingHit();
  }, 11200);
  seqLater(function(){smashCut(ov)}, 16500);
  seqLater(function(){if(seqBusy)smashCut(ov)}, 20000);
}

var VEGAS_SYMS=[
  {e:"☕",n:"KAFFE"},{e:"🖨",n:"SKRIVARE"},{e:"🟩",n:"PIXEL"},
  {e:"📅",n:"KALENDER"},{e:"🍬",n:"GODIS"},{e:"📺",n:"SKÄRMEN"},
  {e:"7️⃣",n:"SJUO"},{e:"🥐",n:"FIKA"},{e:"🐦",n:"ALBATROS"}
];
var VEGAS_PRIZES=[
  "MOTET BLIR ETT MEJL","KALENDERN SKIPPAR LUNCHEN","SKRIVAREN TAPPAR EN GANG",
  "EN KVART UTAN SYNERGI","OPTIONAL BLIR OPTIONAL","POWERPOINT-FRI TISDAG",
  "SKÄRMEN FÅR SEMESTER (2 PIXLAR)","FREDAGSMOTET INSTÄLLT"
];
function buildVegasLights(){
  var box=document.getElementById("vegasLights");box.innerHTML="";
  var n=48, bulbs=[];
  for(var i=0;i<n;i++){
    var b=document.createElement("div");b.className="vegas-bulb";
    var t=i/n, x,y;
    if(t<.25){x=t/.25*100;y=1.6;}
    else if(t<.5){x=98.4;y=((t-.25)/.25)*100;}
    else if(t<.75){x=100-((t-.5)/.25)*100;y=97.6;}
    else{x=1.6;y=100-((t-.75)/.25)*100;}
    b.style.left=x+"%";b.style.top=y+"%";
    box.appendChild(b);bulbs.push(b);
  }
  var idx=0;
  (function chase(){
    if(!seqBusy)return;
    for(var i=0;i<bulbs.length;i++)bulbs[i].className="vegas-bulb"+(Math.abs(i-idx)%8===0?" lit":"");
    idx=(idx+1)%bulbs.length;
    seqLater(chase,70);
  })();
}
function buildStrips(){
  for(var r=0;r<3;r++){
    var el=document.getElementById("vstrip"+r);
    el.style.transition="none";el.style.transform="translateY(0)";
    var html="";
    for(var k=0;k<8;k++){
      for(var i=0;i<VEGAS_SYMS.length;i++){
        html+='<div class="vegas-cell"><span>'+VEGAS_SYMS[i].e+'</span><small>'+VEGAS_SYMS[i].n+'</small></div>';
      }
    }
    el.innerHTML=html;
  }
}
function spinReel(el,dur,stopIdx,done){
  var cellH=180,n=VEGAS_SYMS.length,endY=-((n*5+stopIdx)*cellH);
  var t0=performance.now(),last=0;
  function frame(now){
    if(!seqBusy)return;
    var p=Math.min(1,(now-t0)/dur);
    var e=p<0.72?p/0.72*0.88:0.88+(1-Math.pow(1-(p-0.72)/0.28,3))*0.12;
    el.style.transform="translateY("+(endY*e)+"px)";
    if(now-last>75){last=now;slotClick();}
    if(p<1){var id=requestAnimationFrame(frame);seqRafs.push(id);}
    else{el.style.transform="translateY("+endY+"px)";reelStopThud();done();}
  }
  var id=requestAnimationFrame(frame);seqRafs.push(id);
}
function rainCoins(n){
  var box=document.getElementById("vegasCoins");box.innerHTML="";
  for(var i=0;i<n;i++){
    var c=document.createElement("div");c.className="vegas-coin";
    c.style.left=(4+Math.random()*92)+"%";
    c.style.animationDelay=(Math.random()*0.9)+"s";
    c.style.animationDuration=(1.1+Math.random()*0.7)+"s";
    box.appendChild(c);
  }
}
function startVegas(){
  if(seqBusy)return;
  seqBusy=true;seqClear();getAC();hideSideOvls();setChrome(true);
  var ov=document.getElementById("vegasOverlay");
  document.getElementById("vegasResult").className="";
  document.getElementById("vegasCoins").innerHTML="";
  document.getElementById("vegasSpinBtn").textContent="SPIN";
  ov.className="on flood";ov.style.display="block";
  buildVegasLights();buildStrips();
  seqLater(function(){ov.classList.add("slam");thud();},1800);
  var jack=Math.random()<0.68;
  var near=!jack;
  var a=Math.floor(Math.random()*VEGAS_SYMS.length);
  var b=jack?a:(Math.random()<0.7?a:Math.floor(Math.random()*VEGAS_SYMS.length));
  var c=jack?a:Math.floor(Math.random()*VEGAS_SYMS.length);
  if(near&&b===a&&c===a)c=(a+1)%VEGAS_SYMS.length;
  if(near&&b!==a)c=a;
  seqLater(function(){
    document.getElementById("vegasSpinBtn").textContent="SNURRAR";
    spinReel(document.getElementById("vstrip0"),3600,a,function(){});
    spinReel(document.getElementById("vstrip1"),5200,b,function(){});
    spinReel(document.getElementById("vstrip2"),6800,c,function(){
      var res=document.getElementById("vegasResult");
      var isJack=a===b&&b===c;
      document.getElementById("vegasJack").textContent=isJack?"JACKPOT":"NÄSTAN!";
      document.getElementById("vegasPrize").textContent=isJack
        ? VEGAS_PRIZES[Math.floor(Math.random()*VEGAS_PRIZES.length)]
        : "SKRIVAREN VINNER. MOTET OCKSA.";
      res.className="show";
      if(isJack){jackpotFanfare();rainCoins(36);}
      else{nearMissWah();rainCoins(10);}
    });
  }, 2800);
  seqLater(function(){smashCut(ov)}, 16800);
  seqLater(function(){if(seqBusy)smashCut(ov)}, 20000);
}

document.getElementById("hud").addEventListener("click",function(e){e.stopPropagation();startGta();});
document.getElementById("tickerWrap").addEventListener("click",function(e){e.stopPropagation();startVegas();});
document.addEventListener("keydown",function(e){
  var k=(e.key||"").toLowerCase();
  if(k==="g")startGta();
  if(k==="v")startVegas();
});

var gtaFiredDay=-1,vegasFiredDay=-1;
function checkHijacks(){
  var now=new Date(),day=now.getDay(),time=now.getHours()*60+now.getMinutes(),da=now.getDate();
  if(day>=1&&day<=5&&time>=617&&time<619&&gtaFiredDay!==da){gtaFiredDay=da;startGta();}
  if(day>=1&&day<=5&&time>=854&&time<856&&vegasFiredDay!==da){vegasFiredDay=da;startVegas();}
}
setInterval(checkHijacks,10000);checkHijacks();
