<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bossfight</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;font-family:"Courier New",Consolas,monospace;color:#202020;
  background:linear-gradient(180deg,#f8f8e0 0%,#e8f0c8 52%,#c8e0a0 52%,#b0d088 100%);}
.stage{position:absolute;inset:0 0 33vh 0;}
.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,#a8c878 0%,#90b060 60%,#789850 100%);box-shadow:0 4px 0 #607840;}
.plat.foe{right:7vw;top:33%;width:34vw;height:9vh;}
.plat.me{left:5vw;bottom:-2vh;width:38vw;height:10vh;}
.spr{position:absolute;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.22));}
#foeSpr{right:14vw;top:7%;font-size:min(22vh,15vw);transform:translateX(60vw);transition:transform .7s cubic-bezier(.2,1.2,.4,1),opacity .5s;}
#foeSpr.in{transform:translateX(0);}
#foeSpr.faint{transform:translateY(30vh);opacity:0;transition:transform .6s ease-in,opacity .6s;}
#meSpr{left:12vw;bottom:2vh;font-size:min(25vh,17vw);transform:translateX(-60vw);transition:transform .7s cubic-bezier(.2,1.2,.4,1);}
#meSpr.in{transform:translateX(0);}
.hit{animation:hit .5s steps(2) 1;}
@keyframes hit{0%,100%{opacity:1}25%,75%{opacity:0}}
.shake{animation:shake .4s linear 1;}
@keyframes shake{0%,100%{margin-left:0}20%{margin-left:-14px}40%{margin-left:12px}60%{margin-left:-8px}80%{margin-left:6px}}
.box{position:absolute;background:#f8f8e8;border:4px solid #303030;border-radius:10px 10px 10px 2px;box-shadow:6px 6px 0 rgba(0,0,0,.25);padding:1.2vh 1.6vw;min-width:38vw;}
#foeBox{left:4vw;top:5vh;}
#meBox{right:4vw;bottom:2vh;}
.nm{display:flex;justify-content:space-between;gap:2vw;font-weight:900;font-size:clamp(1.1rem,3.6vh,2rem);letter-spacing:1px;}
.lv{font-size:.8em}
.hpRow{display:flex;align-items:center;gap:.8vw;margin-top:.8vh;}
.hpLbl{font-weight:900;font-size:clamp(.8rem,2.4vh,1.2rem);color:#f8b000;background:#404040;padding:0 .5vw;border-radius:4px;}
.hpBar{flex:1;height:clamp(10px,2.2vh,18px);background:#505050;border:2px solid #303030;border-radius:6px;overflow:hidden;}
.hpFill{height:100%;width:100%;background:#48d048;transition:width .9s ease,background .3s;}
.hpFill.mid{background:#f8c800;}
.hpFill.low{background:#f84838;}
.hpNum{text-align:right;font-weight:900;font-size:clamp(.9rem,2.8vh,1.4rem);margin-top:.4vh;}
#text{position:absolute;left:0;right:0;bottom:0;height:33vh;background:#284868;border-top:6px solid #f8d030;padding:1.2vh 1.4vw;}
#textIn{height:100%;background:#f8f8f8;border:5px solid #c8a018;border-radius:10px;padding:2vh 2.4vw;
  font-weight:900;font-size:clamp(1.4rem,5.4vh,2.8rem);line-height:1.22;color:#202020;position:relative;}
#textIn:after{content:"▼";position:absolute;right:2vw;bottom:1.4vh;font-size:.7em;color:#e04030;animation:blink .7s steps(2) infinite;}
@keyframes blink{50%{opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;}
#flash.go{animation:fl .35s ease-out 1;}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#end{position:fixed;inset:0;background:#000;color:#f5f5f5;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vw;}
#end .l{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(2.4rem,11vh,5rem);letter-spacing:3px;line-height:1.05;text-transform:uppercase;}
#end .r{width:42px;height:2px;background:#00ff88;margin:2vh 0 1.6vh;}
#end .k{font-size:clamp(.9rem,3vh,1.3rem);letter-spacing:3px;text-transform:uppercase;color:#8a8a8a;}
</style>
</head>
<body>
<div class="stage">
  <div class="plat foe"></div>
  <div class="plat me"></div>
  <div class="spr" id="foeSpr">🖨</div>
  <div class="spr" id="meSpr">📺</div>
  <div class="box" id="foeBox">
    <div class="nm"><span id="foeName">SKRIVAREN</span><span class="lv" id="foeLv">Nv.98</span></div>
    <div class="hpRow"><span class="hpLbl">HP</span><div class="hpBar"><div class="hpFill" id="foeHp"></div></div></div>
  </div>
  <div class="box" id="meBox">
    <div class="nm"><span>SKÄRMEN</span><span class="lv">Nv.4.20</span></div>
    <div class="hpRow"><span class="hpLbl">HP</span><div class="hpBar"><div class="hpFill" id="meHp"></div></div></div>
    <div class="hpNum" id="meNum">60/60</div>
  </div>
</div>
<div id="text"><div id="textIn"></div></div>
<div id="flash"></div>
<div id="end"><div class="l" id="endL"></div><div class="r"></div><div class="k" id="endK"></div></div>
<script>
/* Bossfight: Skärmen mot kontorets slutbossar. Inga personer, bara prylar och möten. */
var FOES=[
  {name:"SKRIVAREN",spr:"🖨",lv:"Nv.98",
   intro:"En vild SKRIVARE dök upp! Den luktar varm toner.",
   atk:[["PC LOAD LETTER","Ingen vet vad det betyder. Inte ens SKRIVAREN."],["PAPPERSSTOPP","Fack 2. Fack 3. Ett fack som inte finns."]],
   win:"SKICKA SOM PDF",
   back:"...men SKRIVAREN reser sig! Den har drivrutiner från 2003.",
   end:["SKRIVAREN VINNER","Den vinner alltid. Den har papper."]},
  {name:"KALENDERN",spr:"📅",lv:"Nv.90",
   intro:"En vild KALENDER dök upp! Den är dubbelbokad med sig själv.",
   atk:[["ÄT LUNCHEN","Kort avstämning 11:30–13:00. Det var supereffektivt."],["DUBBELBOKNING","SKÄRMEN är nu i två möten. Båda optional. Båda obligatoriska."]],
   win:"AVBÖJ (UTAN FÖRSLAG)",
   back:"...men KALENDERN skickar en ny inbjudan! \"Uppföljning: 90 min\".",
   end:["KALENDERN VINNER","Ni ses 08:00. Det står optional."]},
  {name:"TEAMS-MÖTET",spr:"🎧",lv:"Nv.47",
   intro:"Ett vilt TEAMS-MÖTE dök upp! 47 deltagare. 0 kameror.",
   atk:[["KAN NI HÖRA MIG?","Det upprepades tre gånger. Ingen kunde svara. Alla var muted."],["DELA FEL FÖNSTER","Alla såg kundvagnen. Alla såg fliken \"jobba hemifrån tips\"."]],
   win:"LÄMNA MÖTET",
   back:"...men TEAMS-MÖTET startar igen! \"Hoppsan, fel länk\".",
   end:["MÖTET VINNER","Inspelningen finns kvar. För alltid."]},
  {name:"KAFFEMASKINEN",spr:"☕",lv:"Nv.99",
   intro:"En vild KAFFEMASKIN dök upp! Den blinkar AVKALKA sedan 2021.",
   atk:[["TÖM SUMPEN","Sumpen var redan full. Den var full som en kalender."],["BARA VARMT VATTEN","Det var inte supereffektivt. Det var bara ledsamt."]],
   win:"TRYCK PÅ ALLA KNAPPAR",
   back:"...men KAFFEMASKINEN kräver avkalkning! Den har fackets stöd.",
   end:["KAFFET VINNER","Utan kaffe inga beslut. Med kaffe inte heller."]}
];
var MOVES=["SKICKA SOM MEJL","STÄNG AV OCH PÅ","CTRL+Z","TA DET OFFLINE"];
var foe=FOES[Math.floor(Math.random()*FOES.length)];
var meMax=60,meHp=60,foeHp=100;
var $=function(id){return document.getElementById(id)};
$("foeName").textContent=foe.name;$("foeSpr").textContent=foe.spr;$("foeLv").textContent=foe.lv;

var typer=null;
function say(t){
  clearInterval(typer);
  var el=$("textIn"),i=0;el.textContent="";
  typer=setInterval(function(){i+=2;el.textContent=t.slice(0,i);if(i>=t.length)clearInterval(typer);},28);
}
function setHp(id,p){
  var f=$(id);f.style.width=Math.max(0,p)+"%";
  f.className="hpFill"+(p<=20?" low":p<=50?" mid":"");
}
function meDmg(n){meHp=Math.max(1,meHp-n);setHp("meHp",meHp/meMax*100);$("meNum").textContent=meHp+"/"+meMax;
  var s=$("meSpr");s.classList.remove("hit");void s.offsetWidth;s.classList.add("hit");
  document.body.classList.remove("shake");void document.body.offsetWidth;document.body.classList.add("shake");}
function foeDmg(p){foeHp=Math.max(0,p);setHp("foeHp",foeHp);
  var s=$("foeSpr");s.classList.remove("hit");void s.offsetWidth;s.classList.add("hit");
  var f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");}
var mv=MOVES.slice().sort(function(){return Math.random()-.5});
var steps=[
  [0,function(){$("foeSpr").classList.add("in");$("meSpr").classList.add("in");say(foe.intro);}],
  [2200,function(){say(foe.name+" använde "+foe.atk[0][0]+"!");}],
  [1000,function(){meDmg(23);}],
  [900,function(){say(foe.atk[0][1]);}],
  [2300,function(){say("SKÄRMEN använde "+mv[0]+"!");}],
  [1000,function(){foeDmg(45);}],
  [700,function(){say("Det är supereffektivt!");}],
  [1500,function(){say(foe.name+" använde "+foe.atk[1][0]+"!");}],
  [1000,function(){meDmg(31);}],
  [900,function(){say(foe.atk[1][1]);}],
  [2400,function(){say("SKÄRMEN använde "+foe.win+"!");}],
  [1000,function(){foeDmg(0);}],
  [800,function(){$("foeSpr").classList.add("faint");say(foe.name+" svimmade! SKÄRMEN fick 0 XP och ett mejl.");}],
  [2600,function(){$("foeSpr").classList.remove("faint");setHp("foeHp",100);say(foe.back);}],
  [2600,function(){var e=$("end");$("endL").textContent=foe.end[0];$("endK").textContent=foe.end[1];e.style.display="flex";}]
];
var t=0;
steps.forEach(function(s){t+=s[0];setTimeout(s[1],t);});
</script>
</body>
</html>
