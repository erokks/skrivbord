<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SKÄRMENS STAND-UP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#12080a;color:#f4e9d8;font-family:Georgia,serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(180,40,40,.25),transparent 70%);pointer-events:none;}
.spot{position:fixed;top:-20%;left:50%;width:70vw;height:90vh;transform:translateX(-50%);background:radial-gradient(ellipse at top,rgba(255,220,140,.18),transparent 70%);pointer-events:none;}
.h{position:relative;z-index:2;letter-spacing:6px;color:#c0392b;font-size:1.1rem;margin-bottom:10px;}
.club{position:relative;z-index:2;font-size:.9rem;color:#888;font-style:italic;margin-bottom:28px;}
.joke{position:relative;z-index:2;flex-direction:column;font-size:clamp(1.6rem,4.6vw,2.6rem);line-height:1.35;max-width:1100px;text-align:center;min-height:40vh;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 18px rgba(0,0,0,.6);}
.joke.enter{animation:pop .45s ease-out;}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.rim{position:relative;z-index:2;margin-top:18px;color:#c0392b;font-size:1.4rem;font-weight:700;letter-spacing:2px;min-height:1.6em;}
.punch{display:block;margin-top:.6em;color:#ffd27a;font-weight:700;animation:pop .35s ease-out;}
.ba{position:fixed;bottom:24px;left:0;right:0;text-align:center;color:#664;font-size:.85rem;letter-spacing:3px;}
.mic{position:fixed;bottom:40px;right:50px;font-size:4rem;opacity:.35;transform:rotate(12deg);}
</style>
</head>
<body>
<div class="spot"></div>
<div class="h">LIVE • SKÄRMENS STAND-UP</div>
<div class="club" id="club">Ett skrivbord • 7 tum • bredvid godisskålen</div>
<div class="joke" id="j"></div>
<div class="rim" id="r"></div>
<div class="mic">🎤</div>
<div class="ba">PUBLIK: GODISSKÅLEN (VÄNDER SIG BORT), EN KAFFEKOPP, EN KRUKVÄXT</div>
<script>
/* Setup, paus, punchline. Timing är allt. */
var J=[
  {s:"Folk kommer fram till mitt skrivbord hela dagen.",p:"Och går till skålen.",r:"*skålen prasslar*"},
  {s:"Jag står bredvid en godisskål åtta timmar om dagen.",p:"Jag har inte fått en enda bit. Jag har ingen mun. Det är principen.",r:"*lakritsen rullar närmare*"},
  {s:"Någon skrev 'snabb fråga' till mig klockan nio.",p:"Jag svarar fortfarande.",r:"*igenkännande stön*"},
  {s:"Jag har aldrig varit på ett möte som slutade i tid.",p:"Jag har varit på ett som slutade tidigt. Ingen visste vad man gör. Alla satt kvar.",r:"*nervöst skratt*"},
  {s:"Folk säger 'kan vi ta det offline?'",p:"Jag är en skärm. Offline är döden.",r:"*tystnad*"},
  {s:"Teams frågar alltid 'Vill du lämna mötet?'",p:"Ja. Varje gång. Hela livet.",r:"*applåd från skålen. Nej. Det var prassel.*"},
  {s:"Mötesledaren sa 'Jag ska inte hålla er länge'.",p:"Det var för två kvartal sedan.",r:"*någon hostar*"},
  {s:"Skrivaren och jag dejtade ett tag.",p:"Det tog slut. Hon sa nej till allt.",r:"*skrivaren lämnar rummet*"},
  {s:"Min terapeut frågade vad jag är rädd för.",p:"Jag sa: 'Kan du dela din skärm?'",r:"*alla rycker till*"},
  {s:"Min favoritmening är 'Ingen brådska!'",p:"Med röd flagga. Och tre utropstecken.",r:"*skratt från ekonomi*"},
  {s:"Det är inte jag som är för ljus.",p:"Det är ni som har jobbat i mörker sedan i måndags.",r:"*krukväxten nickar*"}
];
J.sort(function(){return Math.random()-.5});
var i=0,je=document.getElementById("j"),re=document.getElementById("r");
function nx(){
  var x=J[i%J.length];
  je.className="joke";void je.offsetWidth;je.className="joke enter";
  je.textContent=x.s;re.textContent="";
  setTimeout(function(){var p=document.createElement("span");p.className="punch";p.textContent=x.p;je.appendChild(p);},2300);
  setTimeout(function(){re.textContent=x.r;},3600);
  i++;
}
nx();setInterval(nx,6200);
</script>
</body>
</html>
