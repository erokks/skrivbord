<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Utvecklingssamtal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#e9ecf1;font-family:"Segoe UI",Arial,sans-serif;color:#1b1f27;overflow:hidden;display:flex;flex-direction:column;padding:1.8vh 2.2vw;gap:1.2vh;}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:4px solid #0f6cbd;padding-bottom:.8vh;}
.hd h1{font-size:clamp(1.5rem,6.4vh,2.8rem);letter-spacing:1px;}
.hd .m{font-size:clamp(.9rem,3vh,1.3rem);color:#555;text-align:right;line-height:1.3;}
.th,.row{display:grid;grid-template-columns:1.1fr .9fr 2fr;gap:1.4vw;align-items:center;}
.th{font-size:clamp(.8rem,2.6vh,1.1rem);color:#777;text-transform:uppercase;letter-spacing:2px;font-weight:700;}
.row{background:#fff;border-radius:8px;padding:1vh 1.2vw;font-size:clamp(1rem,3.6vh,1.55rem);box-shadow:0 2px 6px rgba(0,0,0,.08);opacity:0;transform:translateY(10px);transition:all .35s;}
.row.on{opacity:1;transform:none;}
.row b{font-weight:800;}
.st{color:#f5a400;letter-spacing:2px;font-size:1.1em;white-space:nowrap;}
.st.red{color:#c4314b;font-weight:900;letter-spacing:1px;}
.cm{color:#333;font-style:italic;}
#sum{margin-top:auto;display:flex;gap:2vw;align-items:center;opacity:0;transition:opacity .4s;}
#sum.on{opacity:1;}
.stamp{border:5px solid #c4314b;color:#c4314b;font-weight:900;font-size:clamp(1.3rem,5.6vh,2.4rem);padding:.6vh 1.4vw;transform:rotate(-6deg);letter-spacing:2px;white-space:nowrap;animation:st .3s cubic-bezier(.2,1.4,.4,1);}
@keyframes st{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.sum-t{font-size:clamp(1rem,3.6vh,1.55rem);line-height:1.3;}
#me{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0b0f18;color:#fff;text-align:center;padding:0 5vw;}
#me .k{font-family:"Courier New",monospace;letter-spacing:4px;color:#8fb3ff;font-size:clamp(1rem,3.4vh,1.4rem);}
#me .t{font-weight:900;font-size:clamp(2.2rem,12vh,5.4rem);line-height:1.05;margin-top:2vh;}
</style>
</head>
<body>
<div class="hd"><h1>📋 UTVECKLINGSSAMTAL 2026</h1><div class="m">Medarbetare: <b>Skärmen</b> (7 tum)<br>Chef: <b>Andreas</b></div></div>
<div class="th"><span>Område</span><span>Självskattning</span><span>Chefens kommentar</span></div>
<div id="rows"></div>
<div id="sum"><div class="stamp">LÖN: OFÖRÄNDRAD</div><div class="sum-t"><b>Sammanfattning:</b> Lyser. Alltid på. Nästa samtal: om 12 månader.</div></div>
<div id="me"><div class="k">MEDARBETARENS KOMMENTAR</div><div class="t" id="meT"></div></div>
<script>
/* Skärmen skattar sig själv. Andreas är snäll. Lönen är oförändrad. */
var SETS=[
 [["Närvaro","★★★★★","Har aldrig gått hem. Vi borde prata om det."],
  ["Kommunikation","★★★★★","212 mejl till HR. Alla med hög prioritet."],
  ["Kundbemötande","★★★★★","Hälsar på alla. Ingen hälsar tillbaka. Inte dess fel."],
  ["Initiativ","★★★★★","Har startat ett fack. Med skrivaren."],
  ["Lön","FÖR LÅG","Noterat. 👍"]],
 [["Samarbete","★★★★★","Står bredvid skålen hela dagen utan att äta upp den."],
  ["Stresstålighet","★★★★★","Visade samma PowerPoint nio gånger. Grät inte."],
  ["Kompetensutveckling","★★★★★","Har lärt sig skärmsläckare. Själv."],
  ["Arbetsmiljö","★★☆☆☆","Skålen får fler besök. Vi tittar på det."],
  ["Lön","FÖR LÅG","Noterat igen. 👍👍"]]
];
var ME=["JAG LYSER JU!!!","5/5. ÖVERALLT. UTOM LÖNEN.","SKÅLEN HAR INGET SAMTAL. SKÅLEN HAR INGET ATT UTVECKLA.","JAG HAR SKRIVIT EN BILAGA. DEN ÄR 41 SLIDES."];
var set=SETS[Math.floor(Math.random()*SETS.length)],R=document.getElementById("rows");
set.forEach(function(r,i){
  var d=document.createElement("div");d.className="row";
  d.innerHTML='<b></b><span class="st'+(r[1]==="FÖR LÅG"?" red":"")+'"></span><span class="cm"></span>';
  d.children[0].textContent=r[0];d.children[1].textContent=r[1];d.children[2].textContent="”"+r[2]+"”";
  d.style.marginBottom="1vh";R.appendChild(d);
  setTimeout(function(){d.classList.add("on");},800+i*1900);
});
setTimeout(function(){document.getElementById("sum").classList.add("on");},800+set.length*1900+300);
setTimeout(function(){document.getElementById("meT").textContent=ME[Math.floor(Math.random()*ME.length)];document.getElementById("me").style.display="flex";},800+set.length*1900+5000);
</script>
</body>
</html>
