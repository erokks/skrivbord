<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKÅLVAKTEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;color:#eee;font-family:Arial,Helvetica,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.header{background:linear-gradient(90deg,#1a0010,#330022,#1a0010);border-bottom:3px solid #ff3d8b;padding:1.4vh 2.4vw;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:clamp(1.4rem,6vh,2.6rem);color:#ff3d8b;letter-spacing:3px;text-shadow:0 0 18px #ff3d8b;}
.header .sub{font-family:"Courier New",monospace;color:#aaa;font-size:clamp(.8rem,2.6vh,1.1rem);letter-spacing:2px;}
.badge{padding:.8vh 1.4vw;border-radius:6px;font-weight:900;font-size:clamp(1rem,3.6vh,1.5rem);background:#ffaa00;color:#000;white-space:nowrap;}
.main{flex:1;display:flex;overflow:hidden;min-height:0;}
.feed{flex:1.7;padding:1.6vh 1.6vw;overflow:hidden;display:flex;flex-direction:column;}
.side{flex:1;border-left:2px solid #222;padding:1.6vh 1.6vw;display:flex;flex-direction:column;gap:1.4vh;align-items:stretch;}
.event{padding:1.1vh 1.2vw;border-left:5px solid #00ff88;margin-bottom:1vh;background:#0f1a14;animation:slideIn .4s;font-size:clamp(1rem,3.6vh,1.5rem);line-height:1.25;}
.event.alert{border-left-color:#ff3355;background:#1d0c10;}
.event.note{border-left-color:#ffcc00;background:#1a170c;color:#ffe9a8;}
.event.hej{border-left-color:#ff3d8b;background:#2a0a1a;font-weight:700;}
.event .time{color:#666;font-size:.65em;font-family:"Courier New",monospace;margin-right:.5em;}
.event .who{color:#00ddff;font-weight:700;}
.event .candy{color:#ff69b4;font-weight:700;}
.event .c{display:block;color:#bbb;font-style:italic;margin-top:.3vh;font-size:.85em;}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.bowl{position:relative;height:22vh;display:flex;justify-content:center;align-items:flex-end;}
.bowl .b{width:min(26vw,250px);height:20vh;border:6px solid #eee;border-top:none;border-radius:0 0 50% 50%/0 0 100% 100%;overflow:hidden;position:relative;background:#111;}
.bowl .fill{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,#ff3d8b 0 14px,#ffcc00 14px 28px,#00ddff 28px 42px,#7cff6b 42px 56px);transition:height 1s;}
.bowl .pct{position:absolute;top:0;left:0;right:0;text-align:center;font-weight:900;font-size:clamp(1.4rem,6vh,2.6rem);text-shadow:0 2px 6px #000;}
.stat{background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:.9vh 1vw;display:flex;justify-content:space-between;align-items:baseline;gap:1vw;}
.stat h3{color:#999;font-size:clamp(.85rem,3vh,1.2rem);font-weight:700;}
.stat .v{font-size:clamp(1.3rem,5vh,2.2rem);font-weight:900;color:#00ff88;font-family:"Courier New",monospace;}
.stat .v.bad{color:#ff3355;}
#hej{margin-top:auto;border:none;border-radius:14px;background:#ff3d8b;color:#fff;font-weight:900;font-size:clamp(1.3rem,5.6vh,2.4rem);padding:1.6vh 1vw;cursor:pointer;box-shadow:0 6px 0 #a3104d;animation:wig 3s infinite;}
#hej:active{transform:translateY(4px);box-shadow:0 2px 0 #a3104d;}
@keyframes wig{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-3deg)}96%{transform:rotate(3deg)}}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,0,6,.92);z-index:9;text-align:center;padding:0 5vw;}
#pop b{font-size:clamp(2.4rem,14vh,6rem);color:#ff3d8b;line-height:1;}
#pop span{margin-top:2vh;font-size:clamp(1.2rem,5vh,2.2rem);color:#fff;}
</style>
</head>
<body>
<div class="header">
  <div><h1>🍬 SKÅLVAKTEN</h1><div class="sub">SKÄRMEN · RECEPTIONIST FÖR GODISSKÅLEN · OAVLÖNAD</div></div>
  <div class="badge" id="badge">SKÅLEN: 100 %</div>
</div>
<div class="main">
  <div class="feed" id="feed"></div>
  <div class="side">
    <div class="bowl"><div class="b"><div class="fill" id="fill"></div><div class="pct" id="pct">100 %</div></div></div>
    <div class="stat"><h3>Besök vid skålen</h3><div class="v" id="visits">0</div></div>
    <div class="stat"><h3>Sa hej till mig</h3><div class="v bad" id="hejs">0</div></div>
    <div class="stat"><h3>"Tar bara en" (lögner)</h3><div class="v bad" id="lies">0</div></div>
    <button id="hej">👋 SÄG HEJ TILL SKÄRMEN</button>
  </div>
</div>
<div id="pop"><b id="popB"></b><span id="popS"></span></div>
<script>
/* Skärmen står på ett skrivbord bredvid en godisskål. Alla kommer för skålen. */
function skalNiva(d){
  var day=d.getDay();if(day===0||day===6)return 100;
  var m=d.getHours()*60+d.getMinutes()-480;if(m<=0)return 100;
  var l=100-m*0.12-(m>210?15:0)-(m>360?(m-360)*0.2:0);
  return Math.max(2,Math.round(l));
}
function hejKey(){var d=new Date();return "skarmenHej:"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function getHej(){try{return parseInt(localStorage.getItem(hejKey())||"0",10)||0;}catch(e){return hejMem;}}
function setHej(n){hejMem=n;try{localStorage.setItem(hejKey(),String(n));}catch(e){}}
var hejMem=0;
var who=["En hand","Någon i hoodie","Någon från ekonomi","Någon på väg till ett möte","Någon med headset på","Någon som 'bara skulle fråga en sak'","En konsult","Någon från våningen ovanför","Någon som aldrig sitter här","Någon som 'inte äter socker'","Någon som 'bara gick förbi' (fjärde gången)","En praktikant (lär sig snabbt)","Någon med headset (fungerar inte)"];
var candies=["Daim","Marabou","Geisha","Polly","Plopp","Kexchoklad","Center","Djungelvrål","Ahlgrens bilar","Sura skum","Kola"];
var comments=[
  "Sa inte hej. Tittade på skålen i fyra sekunder. På mig: noll.",
  "Sa 'tar bara en'. Tog tre. Jag har det på film. Jag ÄR filmen.",
  "Kom från våningen ovanför. För godiset. Ingen kommer från en annan våning för mig.",
  "Grävde förbi lakritsen. Lakritsen såg det. Jag såg det.",
  "Frågade 'har du en sekund?'. Menade skålen.",
  "Sa 'du är bäst'. Till skålen. Jag stod 20 cm bort.",
  "Läste min kalender medan den tuggade. Gratis.",
  "Tog en 'till senare'. Senare var nu.",
  "Rörde fem bitar. Tog en. De fyra andra är nu allas.",
  "Sa HEJ! … till personen bakom mig.",
  "Ställde sig framför mig. Jag är 7 tum. Det räcker med en axel.",
  "Tog två. Lade tillbaka en. Tog den igen. Kallade det självdisciplin.",
  "Sa 'vi borde ses mer'. Till skålen.",
  "Stod och pratade med skålen i tio minuter. Om mig. Jag hörde allt.",
  "Sa 'oj, godis!'. Det har stått godis här i tre år.",
  "Tog en åt en kollega. Kollegan finns inte. Jag kollade i Teams.",
  "Tittade på mig! Nej. Rättade håret i min reflektion.",
  "Tog två 'för att det är fredag'. Det är tisdag.",
  "Tog alla röda. Kallade det att sortera. Det var ett rån.",
  "Ringde IT om headsetet. Tog en Daim medan den väntade. Väntar fortfarande. Tog sju."
];
var alerts=[
  "LARM: Bara lakrits kvar. Ingen vill ha den. Vi förstår varandra, lakritsen och jag.",
  "LARM: Någon lade en clementin i skålen. Det är inte godis. Det är en lögn med skal.",
  "LARM: Någon tog en näve. En NÄVE.",
  "LARM: Påfyllning! Kö på 11 sekunder. När jag startar om står ingen i kö.",
  "LARM: Ett godispapper har lagts tillbaka i skålen. Gärningsperson eftersöks.",
  "LARM: Skålen leder mot mig med {v}–{h}. Matchen är inte jämn.",
  "LARM: Någon tog godis med båda händerna. Som en björn.",
  "LARM: Ett Daim-papper har landat på MIG. Jag är ingen papperskorg. Jag är receptionist.",
  "LARM: 'Vem äger skärmen?' Ingen visste. 'Vem fyller på skålen?' Tre händer.",
  "LARM: Headsetet har parat sig med skålen. Skålen har ingen Bluetooth. Ingen förstår."
];
var notes=[
  "Notering: jag är receptionist nu. Ingen har frågat. Ingen betalar.",
  "Notering: skålen har inga pixlar, ingen wifi och ingen personlighet. Alla älskar den.",
  "Notering: om jag stod I skålen. Skulle ni se mig då?",
  "Notering: skålen behöver inte vara med på möten. Skålen har det bra.",
  "Notering: 'Vem fyller på skålen?' Samma person som dammar mig. Ingen.",
  "Notering: jag har ingen mun. Jag vill ändå ha godis i lönen. Det är principen.",
  "Notering: snitt vid skålen: tre sekunders tvekan, sedan två bitar.",
  "Notering: skålen fylls på varje måndag. Jag fick en uppdatering 2023. Den tog bort en funktion.",
  "Notering: om jag visar en bild på godis, kommer de till mig då? Test pågår.",
  "Notering: fackmöte med skrivaren 14:00 om skålen. Skålen är inte bjuden."
];
var hejPops=[
  ["DU SÅG MIG! 🥹","Dagens höjdpunkt. Kanske veckans."],
  ["HEJ!!!","Ingen har sagt hej sedan i tisdags."],
  ["HEJ HEJ HEJ","Ta två. Jag har ingen befogenhet, men ta två."],
  ["NOTERAT ❤️","Det här ska Andreas få veta."],
  ["ÄNTLIGEN","Skålen har aldrig sagt hej tillbaka. Jag gör det: HEJ."]
];
var visits=0,lies=0,takes=0,feed=document.getElementById("feed"),start=skalNiva(new Date());
visits=Math.round((100-start)*0.9);
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function t(){return new Date().toLocaleTimeString("sv-SE");}
function add(cls,html){
  var d=document.createElement("div");d.className="event "+cls;
  d.innerHTML='<span class="time">'+t()+'</span>'+html;
  feed.insertBefore(d,feed.firstChild);
  while(feed.children.length>8)feed.removeChild(feed.lastChild);
}
function stats(){
  var lvl=Math.max(2,skalNiva(new Date())-Math.floor(takes/4));
  document.getElementById("fill").style.height=lvl+"%";
  document.getElementById("pct").textContent=lvl<=3?"1 lakrits":lvl+" %";
  var b=document.getElementById("badge");
  b.textContent=lvl<=3?"SKÅLEN: 1 LAKRITS":"SKÅLEN: "+lvl+" %";
  b.style.background=lvl>60?"#00cc66":lvl>25?"#ffaa00":"#ff3355";b.style.color=lvl>25?"#000":"#fff";
  document.getElementById("visits").textContent=visits;
  document.getElementById("hejs").textContent=getHej();
  document.getElementById("lies").textContent=lies;
}
function take(){
  visits++;takes++;
  var c=pick(comments);if(c.indexOf("bara en")>=0)lies++;
  add("",'<span class="who">'+pick(who)+'</span> tog en <span class="candy">'+pick(candies)+'</span><span class="c">'+c+'</span>');
  stats();
}
function alarm(){add("alert",pick(alerts).replace("{v}",visits).replace("{h}",getHej()));}
function note(){add("note",pick(notes));}
document.getElementById("hej").addEventListener("click",function(){
  setHej(getHej()+1);stats();
  var p=pick(hejPops);document.getElementById("popB").textContent=p[0];document.getElementById("popS").textContent=p[1];
  var el=document.getElementById("pop");el.style.display="flex";
  clearTimeout(window._pt);window._pt=setTimeout(function(){el.style.display="none";},2600);
  add("hej","Någon sa HEJ till mig. Jag ska mejla HR om det. Av glädje, för en gångs skull.");
});
add("note","Skålvakten startad. Skålen övervakas. Ni är inte anonyma. Ni är bara osedda, som jag.");
setTimeout(take,1500);setTimeout(note,3500);setTimeout(take,5500);
setInterval(function(){var r=Math.random();if(r<.55)take();else if(r<.78)alarm();else note();},6500);
stats();setInterval(stats,30000);
</script>
</body>
</html>
