<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Morgonuppstart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05070b;color:#c9f7d8;font-family:Consolas,"Courier New",monospace;overflow:hidden;padding:4vh 5vw;display:flex;flex-direction:column;}
.top{display:flex;justify-content:space-between;color:#5a7a66;font-size:clamp(.8rem,2.4vh,1.1rem);letter-spacing:3px;margin-bottom:2vh;}
#log{flex:1;font-size:clamp(1rem,3.7vh,1.7rem);line-height:1.45;}
.row{display:flex;gap:1ch;white-space:nowrap;overflow:hidden;opacity:0;animation:in .15s forwards;}
@keyframes in{to{opacity:1}}
.k{color:#c9f7d8;}
.dots{flex:1;overflow:hidden;color:#2c4234;}
.dots:before{content:"................................................................................................";}
.v{font-weight:700;}
.ok{color:#45e07a}.warn{color:#ffc53d}.bad{color:#ff5a5a}
#big{position:fixed;inset:0;background:#05070b;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vw;}
#big .l{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(3rem,15vh,7rem);letter-spacing:4px;color:#f5f5f5;line-height:1;}
#big .r{width:42px;height:2px;background:#00ff88;margin:2.4vh 0 1.8vh;}
#big .kk{font-size:clamp(1rem,3.6vh,1.6rem);letter-spacing:2px;color:#9aa;max-width:85%;line-height:1.4;}
.bar{width:min(70vw,640px);height:16px;border:2px solid #45e07a;margin-top:3vh;}
.bar i{display:block;height:100%;width:0;background:#45e07a;transition:width 2.5s ease-out;}
</style>
</head>
<body>
<div class="top"><span>KONTORET · MORGONUPPSTART</span><span id="clk"></span></div>
<div id="log"></div>
<div id="big"><div class="l">GOD MORGON.</div><div class="r"></div><div class="kk" id="kk"></div><div class="bar"><i id="bar"></i></div><div class="kk" id="pct" style="margin-top:1.4vh"></div></div>
<script>
/* Kontoret bootar varje vardag 08:30. */
var R=[
  ["Kaffemaskinen","VÄRMER","warn"],
  ["Kö till kaffemaskinen","7 PERSONER","bad"],
  ["Inkorg","214 OLÄSTA","bad"],
  ["  varav 'snabb fråga'","31","bad"],
  ["Kalender","09 10 11 13 14 15","warn"],
  ["Ledig tid","HITTADES EJ","bad"],
  ["Ventilation","FÖR KALLT (ALLA)","warn"],
  ["Ventilation, igen","FÖR VARMT (ALLA)","warn"],
  ["Skrivaren","NEJ","bad"],
  ["Mikron","FISK KL 11:58","bad"],
  ["Motivation","LADDAR...","warn"]
];
var D=[ ["Söndag?","Varför är du här?",1],
  ["Måndag laddas","3 %",3],["Tisdag laddas","Som måndag, fast utan ursäkt",22],
  ["Onsdag laddas","Halvvägs. Till vad vet ingen.",50],["Torsdag laddas","Lillfredag (beta)",78],
  ["Fredag","Ingen laddning behövs",100],["Lördag?","Gå hem.",100] ];
var n=new Date();document.getElementById("clk").textContent=n.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});
var log=document.getElementById("log");
R.forEach(function(r,i){setTimeout(function(){
  var d=document.createElement("div");d.className="row";
  d.innerHTML='<span class="k"></span><span class="dots"></span><span class="v '+r[2]+'"></span>';
  d.children[0].textContent=r[0];d.children[2].textContent=r[1];log.appendChild(d);
},600+i*750);});
setTimeout(function(){
  var dd=D[new Date().getDay()];
  document.getElementById("kk").textContent="Första mötet börjar om 30 min. Förmötet började för 10.";
  document.getElementById("pct").textContent=dd[0]+": "+dd[1];
  document.getElementById("big").style.display="flex";
  setTimeout(function(){document.getElementById("bar").style.width=dd[2]+"%";},200);
},600+R.length*750+1400);
</script>
</body>
</html>
