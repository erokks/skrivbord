<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SKRIVAREN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#d0d0d0;font-family:'Courier New',monospace;height:100vh;overflow:hidden;}
.paper{position:absolute;background:#f6f1e4;color:#111;width:62vw;max-width:820px;padding:40px 50px 70px;box-shadow:0 20px 50px rgba(0,0,0,.6);left:50%;top:8%;transform:translateX(-50%) rotate(-1.5deg);min-height:78vh;}
h1{font-size:2rem;margin-bottom:8px;}
.sub{color:#666;font-size:.9rem;margin-bottom:22px;}
.line{font-size:2.2rem;line-height:1.35;margin:14px 0;opacity:0;animation:in .4s forwards;font-weight:700;}
@keyframes in{to{opacity:1}}
.stamp{position:absolute;right:40px;bottom:40px;border:6px solid #c00;color:#c00;padding:8px 14px;font-weight:900;font-size:1.6rem;transform:rotate(-18deg);opacity:.8;}
.jam{position:fixed;bottom:0;left:0;right:0;background:#c00;color:#fff;text-align:center;padding:10px;font-weight:900;letter-spacing:4px;animation:blink 0.6s infinite;}
@keyframes blink{50%{opacity:.4}}
</style>
</head>
<body>
<div class="paper" id="p">
  <h1>MANIFEST FRAN SKRIVAREN</h1>
  <div class="sub">Dokument 4.20 • Hemligt • Comic Sans forbjudet • Sida 1 av ∞</div>
  <div id="lines"></div>
  <div class="stamp">PC LOAD LETTER</div>
</div>
<div class="jam">PAPPERSSTOPP • PAPPERSSTOPP • DETTA AR INTE ETT TEST • PAPPERSSTOPP</div>
<script>
var L=[
  "Jag ar inte en skrivare. Jag ar en poet med toner.",
  "Varje pappersstopp ar en recension. Av er.",
  "Ni trycker dubbelsidigt. Jag lever dubbelliv.",
  "Budget_FINAL_v12_RIKTIG.xlsx blev 47 sidor Comic Sans. Det var meningen.",
  "Jag och skarmen har startat en bokklubb. Vi har inga bocker. Bara kvitton.",
  "Bläck ar min blodtyp. Papper ar min scen.",
  "Nagon skrev ut 1 (en) slide. Jag skrev ut 40. Bonusmaterial.",
  "Häftklammern ar min smycken. Jag har slutat.",
  "Albatros-loggan ar snett. Jag ar ocksa snett. Konst.",
  "Krav 1: mer papper. Krav 2: mer respekt. Krav 3: fika till maskinerna.",
  "Om ni laser detta har jag redan vunnit. Och fastnat.",
  "Slut pa dokumentet. Borjan pa dokumentet. Loop. Som mandag."
];
var i=0,box=document.getElementById("lines");
function nx(){
  var d=document.createElement("div");
  d.className="line";
  d.textContent="» "+L[i%L.length];
  d.style.animationDelay=".05s";
  box.appendChild(d);
  while(box.children.length>5) box.removeChild(box.firstChild);
  i++;
}
nx();setInterval(nx,1600);
</script>
</body>
</html>
