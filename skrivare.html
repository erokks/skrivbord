<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Skrivare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;height:100vh;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;}
.dlg{width:min(92vw,520px);background:#f0f0f0;border:1px solid #888;box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px #333;color:#111;}
.titlebar{background:linear-gradient(#fff,#e8e8e8);border-bottom:1px solid #bbb;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:.95rem;font-weight:600;}
.x{width:28px;height:22px;border:1px solid #bbb;background:#eee;text-align:center;line-height:20px;font-size:.8rem;color:#444;}
.body{padding:18px 20px 14px;display:flex;gap:16px;align-items:flex-start;}
.ico{font-size:2.6rem;line-height:1;filter:grayscale(.2);}
.msg h1{font-size:1.15rem;font-weight:700;margin-bottom:8px;}
.msg p{font-size:1.02rem;line-height:1.45;color:#222;min-height:3.2em;}
.meta{margin-top:10px;font-size:.82rem;color:#555;font-family:Consolas,"Courier New",monospace;}
.btns{padding:10px 16px 14px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #ddd;background:#eaeaea;}
.btn{min-width:88px;padding:6px 14px;border:1px solid #888;background:linear-gradient(#fff,#e6e6e6);font-size:.9rem;text-align:center;}
.btn.primary{border-color:#2b579a;background:linear-gradient(#5b9bd5,#2b579a);color:#fff;font-weight:700;}
.jam{position:fixed;bottom:0;left:0;right:0;background:#111;color:#f5f5f5;text-align:center;padding:8px;font-size:.78rem;letter-spacing:2px;font-family:Consolas,monospace;opacity:.85;}
</style>
</head>
<body>
<div class="dlg">
  <div class="titlebar"><span>Skrivare — HP DeskJet (Rum B)</span><span class="x">×</span></div>
  <div class="body">
    <div class="ico">🖨</div>
    <div class="msg">
      <h1 id="h">Papper saknas i fack 2</h1>
      <p id="p">Det finns inget fack 2.</p>
      <div class="meta" id="m">Jobb: Agenda.pdf · Sidor: 1 · Status: NEJ</div>
    </div>
  </div>
  <div class="btns"><div class="btn">Avbryt</div><div class="btn primary" id="ok">OK</div></div>
</div>
<div class="jam">PAPPERSSTOPP · ÖPPNA LUCKA A · ÖPPNA LUCKA B · DET FINNS INGEN LUCKA B</div>
<script>
var L=[
  {h:"Papper saknas i fack 2",p:"Det finns inget fack 2.",m:"Jobb: Agenda.pdf · Sidor: 1 · Status: NEJ"},
  {h:"Pappersstopp",p:"Öppna lucka A. Öppna lucka B. Stäng båda. Gråt lite.",m:"Lucka C: finns inte · Status: STOPP"},
  {h:"Toner slut",p:"Den var aldrig full.",m:"Ny toner: 1 400 kr · Ny skrivare: 900 kr"},
  {h:"Skriver ut...",p:"Någon annans 87 sidor. Ditt jobb ligger under.",m:"Kö: 1 · Din plats: under"},
  {h:"Dubbelsidigt?",p:"Ja. Båda sidorna är tomma.",m:"Läge: duplex · Innehåll: inget"},
  {h:"Uppdatering krävs",p:"Skrivaren startar om. Om 45 minuter. Kanske.",m:"Drivrutin: 2003 · Status: TRÖTT"},
  {h:"Anslut till nätverk",p:"Skrivaren hittar ett nätverk. Grannens.",m:"WiFi: Grannen_5G · Status: OTROGEN"},
  {h:"Klar!",p:"Jobbet skrevs ut på skrivaren på tredje våningen.",m:"Ni har ingen tredje våning"}
];
var i=0;
function nx(){
  var x=L[i%L.length];
  document.getElementById("h").textContent=x.h;
  document.getElementById("p").textContent=x.p;
  document.getElementById("m").textContent=x.m;
  document.getElementById("ok").textContent=["OK","Nej","Försök igen","Ge upp"][i%4];
  i++;
}
nx();setInterval(nx,2200);
</script>
</body>
</html>
