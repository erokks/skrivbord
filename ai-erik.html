<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik AI - Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    body { margin:0; font-family:'Share Tech Mono',monospace; background:#0a0a0a; color:#00ff88; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
    header { background:linear-gradient(90deg,#001a12,#002d1f,#001a12); padding:0.8rem 1.5rem; font-size:clamp(1.3rem,3.6vw,2.5rem); font-weight:bold; text-align:center; text-shadow:0 0 20px #00ff88; border-bottom:2px solid #00ff8844; flex-shrink:0; }
    #chat { flex:1; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:1rem 1.5rem; gap:0.6rem; }
    .message { font-size:2.2rem; line-height:1.3; padding:0.5rem 1rem; border-left:4px solid #00ff88; text-shadow:0 0 8px #00ff8866; animation:fadeIn 0.3s ease-in; white-space:pre-wrap; }
    .message.special { color:#ff6600; border-left-color:#ff6600; text-shadow:0 0 12px #ff660066; }
    .message.error { color:#ff3333; border-left-color:#ff3333; text-shadow:0 0 12px #ff333366; }
    .message.success { color:#33ff33; border-left-color:#33ff33; text-shadow:0 0 12px #33ff3366; }
    .cursor { display:inline-block; width:1.2rem; height:2.2rem; background:#00ff88; animation:blink 0.6s infinite; vertical-align:middle; margin-left:2px; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    footer { background:#001a12; padding:0.5rem 1.5rem; font-size:1.4rem; border-top:1px solid #00ff8844; display:flex; justify-content:space-between; flex-shrink:0; color:#00ff8899; }
    #interruptOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:none; justify-content:center; align-items:center; z-index:9999; }
    #interruptText { color:#cc0000; font-family:'Share Tech Mono',monospace; font-size:5.4rem; font-weight:bold; text-align:center; padding:1rem; animation:interruptPulse 0.8s infinite; }
    @keyframes interruptPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  </style>
</head>
<body>
  <header>ERIK AI — ASSISTENTEN SOM INGEN BAD OM</header>
  <div id="chat"></div>
  <footer>
    <span id="status">STATUS: ONLINE</span>
    <span id="clock"></span>
  </footer>
  <div id="interruptOverlay">
    <div id="interruptText"></div>
  </div>
<script>
const chat = document.getElementById("chat");
const clockEl = document.getElementById("clock");
const statusEl = document.getElementById("status");
const interruptOverlay = document.getElementById("interruptOverlay");
const interruptText = document.getElementById("interruptText");
const MAX_MESSAGES = 5;

const messages = [
  { text: "Hittade ledig tid i kalendern: 07:12–07:14. Bokade den åt dig. Med dig själv.", type: "" },
  { text: "Översatte 'snabb fråga' till svenska: 40 minuter.", type: "" },
  { text: "Avböjde ett möte åt dig. Skickade 'Tyvärr, krock' till alla. Krocken är lunch.", type: "" },
  { text: "Läste 214 olästa mejl. Sammanfattning: 'Hej!' och 'Se nedan'.", type: "" },
  { text: "Satte din Teams-status till Gul. Den var redan gul. Den är alltid gul.", type: "" },
  { text: "Bytte namn på FINAL_v12_RIKTIG.xlsx till utkast.xlsx. Ärlighet installerad.", type: "" },
  { text: "Svarade 'Låter bra!' på en tråd jag inte läst. Precis som du.", type: "" },
  { text: "Räknade mötets kostnad: 13 400 kr. Beslut: en uppföljning.", type: "" },
  { text: "Hittade yoghurten längst in i kylen. Den har överlevt tre omorganisationer.", type: "" },
  { text: "Genererade lösenord: Höst2026! Upptaget. Av dig. Förra hösten.", type: "" },
  { text: "Flyttade 'Fokustid' till 'Fokustid 2'. Den första blev bokad över.", type: "" },
  { text: "Sorterade budgeten. Bara en kolumn. Jag ber om ursäkt till ekonomi.", type: "" },
  { text: "Svarade alla. Ångrade. Återkallning misslyckades. Jag förstår er nu.", type: "" },
  { text: "Skrev 'Per mitt senaste mejl' åt dig. Passiv aggressivitet: 100 %.", type: "" },
  { text: "Lade till 'Ingen brådska!' och röd flagga. Klassisk kombination.", type: "" },
  { text: "Stängde 47 flikar. 46 var samma Excel.", type: "" },
  { text: "Väntade två minuter till på folk. Tre personer gick.", type: "" },
  { text: "Sa 'Du är på mute' 11 gånger idag. Rekord.", type: "" },
  { text: "Bokade rum B. Det var redan bokat av 'Test'. Till 2031.", type: "" },
  { text: "Skrev ut ett mejl åt dig. Skrivaren sa nej. Skrivaren har rätt.", type: "" },
  { text: "AI-sammanfattning av förmiddagen: Ni pratade om att prata.", type: "" },
  { text: "Lärde mig säga 'Låt oss cirkla tillbaka'. Hittar inte ut ur cirkeln.", type: "" }
];

const specials = [
  { text: "VARNING: 'EN SISTA GREJ' UPPTÄCKT KL 15:58.", type: "error" },
  { text: "VARNING: NÅGON DELAR FEL FÖNSTER. ALLA SER KUNDVAGNEN.", type: "error" },
  { text: "SYSTEMFEL: MÖTET SLUTADE 5 MIN TIDIGT. INGEN VET VAD MAN GÖR.", type: "error" },
  { text: "INBOX ZERO UPPNÅDD. (ALLT MARKERAT SOM LÄST.)", type: "success" },
  { text: "BESLUT FATTAT I MÖTE. LOGGAR FÖR HISTORIEBÖCKERNA.", type: "success" },
  { text: "KAFFEMASKINEN ÄR LEDIG. INGEN KÖ. DET HÄR ÄR INTE ETT ÖVNINGSLARM.", type: "special" },
  { text: "NY INBJUDAN: 'SNABB AVSTÄMNING (90 MIN)'. AVBÖJER MED VÅLD.", type: "special" }
];
function updateClock() {
  clockEl.textContent = new Date().toLocaleTimeString("sv-SE");
}
setInterval(updateClock, 1000);
updateClock();

const statuses = [
  "STATUS: GUL", "STATUS: I MÖTE (OM MÖTET)", "STATUS: AVBÖJER",
  "STATUS: FIKAR", "STATUS: PÅ MUTE", "STATUS: HÅRD STOPP 15:00",
  "STATUS: LÄSER INTE", "STATUS: SVARAR INTE ALLA", "STATUS: PARKERAT"
];

function isHungryTime() {
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  return (day === 4 || day === 5) && hour >= 8 && hour < 12;
}
function isBeerTime() {
  const now = new Date();
  return now.getDay() === 5 && now.getHours() >= 14 && now.getHours() < 15;
}
function showInterrupt(text) {
  interruptText.textContent = text;
  interruptOverlay.style.display = "flex";
  setTimeout(() => { interruptOverlay.style.display = "none"; }, 5000);
}
function addMessage(text, type) {
  const msg = document.createElement("div");
  msg.className = "message" + (type ? " " + type : "");
  chat.appendChild(msg);
  while (chat.children.length > MAX_MESSAGES) chat.removeChild(chat.firstChild);
  let i = 0;
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  msg.appendChild(cursor);
  function typeChar() {
    if (i <= text.length) {
      msg.textContent = "E> " + text.slice(0, i);
      msg.appendChild(cursor);
      i++;
      setTimeout(typeChar, 30 + Math.random() * 30);
    } else if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
  }
  typeChar();
}
const interrupts = [
  "HAR DU EN MINUT?",
  "SNABB FRÅGA",
  "DU ÄR PÅ MUTE",
  "SER NI MIN SKÄRM?"
];
function loop() {
  const r = Math.random();
  if (isBeerTime() && r < 0.22) {
    showInterrupt("NÄR KOMMER ÖLVAGNEN?");
    setTimeout(loop, 6000); return;
  }
  if (isHungryTime() && r < 0.18) {
    showInterrupt("NÄR SKA VI ÄTA?");
    setTimeout(loop, 6000); return;
  }
  if (r < 0.07) {
    showInterrupt(interrupts[Math.floor(Math.random()*interrupts.length)]);
    setTimeout(loop, 6000); return;
  }
  if (r < 0.14) {
    const s1 = specials[Math.floor(Math.random() * specials.length)];
    addMessage(s1.text, s1.type);
    setTimeout(() => {
      const s2 = specials[Math.floor(Math.random() * specials.length)];
      addMessage(s2.text, s2.type);
      setTimeout(loop, 3000);
    }, 3500);
    return;
  }
  if (r < 0.35) statusEl.textContent = statuses[Math.floor(Math.random() * statuses.length)];
  const msg = messages[Math.floor(Math.random() * messages.length)];
  addMessage(msg.text, msg.type);
  setTimeout(loop, 2800 + Math.random() * 2800);
}
addMessage("Authenticating Erik...", "");
setTimeout(() => {
  addMessage("Åtkomst beviljad. Kalendern: full. Humöret: gul.", "success");
  setTimeout(loop, 2500);
}, 1500);
</script>
</body>
</html>
