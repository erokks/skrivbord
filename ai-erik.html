<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik AI - Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    body { margin:0; font-family:'Share Tech Mono',monospace; background:#0a0a0a; color:#00ff88; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
    header { background:linear-gradient(90deg,#001a12,#002d1f,#001a12); padding:0.8rem 1.5rem; font-size:2.5rem; font-weight:bold; text-align:center; text-shadow:0 0 20px #00ff88; border-bottom:2px solid #00ff8844; flex-shrink:0; }
    #chat { flex:1; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:1rem 1.5rem; gap:0.6rem; }
    .message { font-size:2.2rem; line-height:1.3; padding:0.5rem 1rem; border-left:4px solid #00ff88; text-shadow:0 0 8px #00ff8866; animation:fadeIn 0.3s ease-in; white-space:pre-wrap; }
    .message.special { color:#ff6600; border-left-color:#ff6600; text-shadow:0 0 12px #ff660066; }
    .message.error { color:#ff3333; border-left-color:#ff3333; text-shadow:0 0 12px #ff333366; }
    .message.success { color:#33ff33; border-left-color:#33ff33; text-shadow:0 0 12px #33ff3366; }
    .cursor { display:inline-block; width:1.2rem; height:2.2rem; background:#00ff88; animation:blink 0.6s infinite; vertical-align:middle; margin-left:2px; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    footer { background:#001a12; padding:0.5rem 1.5rem; font-size:1.4rem; border-top:1px solid #00ff8844; display:flex; justify-content:space-between; flex-shrink:0; color:#00ff8899; }
    #interruptOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:none; justify-content:center; align-items:center; z-index:9999; }
    #interruptText { color:#cc0000; font-family:'Share Tech Mono',monospace; font-size:5.4rem; font-weight:bold; text-align:center; padding:1rem; animation:interruptPulse 0.8s infinite; }
    @keyframes interruptPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  </style>
</head>
<body>
  <header>ERIK AI v4.20 — SKAMT KERNEL</header>
  <div id="chat"></div>
  <footer>
    <span id="status">STATUS: ONLINE</span>
    <span id="clock"></span>
  </footer>
  <div id="interruptOverlay">
    <div id="interruptText"></div>
  </div>
<script>
const chat = document.getElementById("chat");
const clockEl = document.getElementById("clock");
const statusEl = document.getElementById("status");
const interruptOverlay = document.getElementById("interruptOverlay");
const interruptText = document.getElementById("interruptText");
const MAX_MESSAGES = 5;

const messages = [
  { text: "Avbokar 90-minuters 'kort avstamning'. Skickar mejlet istallet. Civilisation.", type: "" },
  { text: "Kalendern at lunchen. Aterstaller brickan. Kallade det inte alignment.", type: "" },
  { text: "47 inbjudna, 0 agenda. Markerar motet som optional. Det var det inte.", type: "" },
  { text: "Skrivaren skrev ut 1 slide x 40. Stoppar spoolern. Skickar PDF. En gang.", type: "" },
  { text: "PC LOAD LETTER avkodad: nej. Svarar med ett mejl. Papperet forlorade.", type: "" },
  { text: "FINAL_v12_RIKTIG.xlsx byter namn till utkast_1.xlsx. Ljuget upphor.", type: "" },
  { text: "Teams: kan ni hora mig x3. Mutar rummet. Rec av. Beslut: boka inte igen.", type: "" },
  { text: "Agenda 404. Skapar en punkt: skicka mejlet. Motet overlever inte det.", type: "" },
  { text: "Skriver ut rapport i Comic Sans. Skrivaren strejkar. Fortjant.", type: "" },
  { text: "Oversatter synergi till danska. Resultat: synergi. Fakturerar anda.", type: "" },
  { text: "Skickar kalenderinbjudan till kaffemaskinen. 418 I'm a teapot. Battre an mote.", type: "" },
  { text: "Bokar konferens B for tystnad. Kalendern la till synergi. Avvisad.", type: "" },
  { text: "Installerar om skrivare. Skrivaren ar inte ansluten. Skrivaren har principer.", type: "" },
  { text: "Markerar alla moten over lunch som brott. Kalendern overklagar. Avslag.", type: "" },
  { text: "Fredagsmote upptackt. Flyttar till mandag. Nej: flyttar till mejl.", type: "" },
  { text: "PowerPoint: 40 slides, 0 poang. Komprimerar till 3 rader. Inbox appladerar.", type: "" },
  { text: "VLOOKUP hittade inget. Precis som agendan. Stanger fliken. Frid.", type: "" },
  { text: "Decaf i sektorn. Evakuerar kaffet. Motet stannar. Motet forlorar.", type: "" },
  { text: "Skapar backup av backupen. Vagrar kalla den FINAL. Ljug-filter pa.", type: "" },
  { text: "Ritar en albatross i ASCII. Kallar det inte Q3-strategi. Kallar det fagel.", type: "" },
  { text: "Pingar ol-vagnen. Timeout. Det ar inte fredag. Moral: anda hogre an motet.", type: "" },
  { text: "Startar loop i loop for att losa loopproblem. Som statusmoten. Stoppar loopen.", type: "" },
  { text: "Optimerar optimeringsfunktionen. Den blev langsammare. Som synergi 2.0.", type: "" },
  { text: "Skickar 1 mejl till skrivaren. Inte 100. Skrivaren svarar: antligen.", type: "" },
  { text: "Arkiverar 90-sidig tom PDF. Den hette Agenda. Arligaste filen i ar.", type: "" },
  { text: "Gor om allt i VERSALER. DETTE AR INTE ETT MOTE. DETTE AR ETT MEJL.", type: "" },
  { text: "Skriver ut en PDF och scannar in den. Cirkeln sluts. Brottsplatsen ocksa.", type: "" },
  { text: "Lagger till sig sjalv i alla mejllistor. Inte i alla moten. Grans.", type: "" },
  { text: "Byter bakgrund till Comic Sans. En gang. For historien. Brandkar redo.", type: "" },
  { text: "Analyserar om mandagsmotet behovs. Slutsats: nej. Implementering: mejl.", type: "" },
  { text: "Tränar pixlarna i stand-up. Forsta sketchen: Detta kunde varit ett mejl.", type: "" },
  { text: "Kaffemaskinen mute:ar motet. Loggar som enda vettiga beslutet idag.", type: "" },
  { text: "Skickar tackmejl till skrivaren. Svar: PC LOAD LETTER. Oversattning: nej.", type: "" },
  { text: "Uppgraderar fika fran mote till religion. Ingen opponerade sig. Rec av.", type: "" },
  { text: "Bokar inte om. Skickar tre rader. Civilisation nasta.", type: "" },
  { text: "WiFi: ansluten. Agenda: 404. Åtgärd: inbox. Status: vuxen.", type: "" },
  { text: "Albatros flyger. Motet gor inte det. Flyttar punkten till mejl.", type: "" },
  { text: "Optional, men kom. Andrar till: optional, kom inte. Brandovning undantagen.", type: "" },
  { text: "Pappersstopp avkodat som policy. Las mejlet. Papperet har redan vunnit.", type: "" },
  { text: "Installerar ett mejl-API. Rate limit: ett. Kalendern: chockad. Och tom.", type: "" }
];

const specials = [
  { text: "ADMINLAEGE: AVBOKAR 90-MINUTERS. SKICKAR MEJLET. CIVILISATION.", type: "special" },
  { text: "VARNING: KORT AVSTAMNING UTAN SLUTTID. REC AR PA.", type: "error" },
  { text: "SYSTEMFEL: 47 INNE. 0 BESLUT. BESLUT: BOKA INTE IGEN.", type: "error" },
  { text: "KALENDERN AT LUNCHEN. ATERSTALLER BRICKAN. INGET ALIGNMENT.", type: "error" },
  { text: "SKRIVAREN: EN SLIDE, 40 KOPIOR. SPOOLERN STOPPAD.", type: "success" },
  { text: "PC LOAD LETTER PUBLICERAD. OVERSATTNING: NEJ.", type: "success" },
  { text: "VARNING: COMIC SANS I FAKTURA. BRANDKAR TILLKALLAT. SENT.", type: "error" },
  { text: "AGENDA 404. INBOX 200. MOTET OVERLEVER INTE DET.", type: "special" },
  { text: "FREDAGSMOTET INSTALLT. OL-VAGN HELIG. POLICY.", type: "success" },
  { text: "OPTIONAL, MEN KOM. ANDRAT TILL: KOM INTE. BRANDOVNING UNDANTAGEN.", type: "special" },
  { text: "DECAF I SEKTORN. EVAKUERING. MOTET STANNAR. MOTET FORLORAR.", type: "error" },
  { text: "SKARMEN (GAST) KOR RUMMET. MUTED. ANDA VARD.", type: "special" },
  { text: "FINAL_v12 LJUGDE I NAMNET. BYTT TILL utkast_1.xlsx.", type: "success" },
  { text: "OL-VAGN PING: NEGATIV. MOTES-PING: OCKSA. MORAL: MEJL.", type: "error" },
  { text: "SKAMT-KERNEL: DETTA KUNDE VARIT ETT MEJL. DENSITET: OLAGLIG.", type: "special" }
];

function updateClock() {
  clockEl.textContent = new Date().toLocaleTimeString("sv-SE");
}
setInterval(updateClock, 1000);
updateClock();

const statuses = [
  "STATUS: ONLINE", "STATUS: SKICKAR MEJL", "STATUS: AVBOKAR",
  "STATUS: FIKAR", "STATUS: MUTED", "STATUS: KAFFEPAUS",
  "STATUS: AGENDA 404", "STATUS: INBOX", "STATUS: SKAMTAR",
  "STATUS: HDMI", "STATUS: REC AV", "STATUS: VLOOKUP?"
];

function isHungryTime() {
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  return (day === 4 || day === 5) && hour >= 8 && hour < 12;
}
function isBeerTime() {
  const now = new Date();
  return now.getDay() === 5 && now.getHours() >= 14 && now.getHours() < 15;
}
function showInterrupt(text) {
  interruptText.textContent = text;
  interruptOverlay.style.display = "flex";
  setTimeout(() => { interruptOverlay.style.display = "none"; }, 5000);
}
function addMessage(text, type) {
  const msg = document.createElement("div");
  msg.className = "message" + (type ? " " + type : "");
  chat.appendChild(msg);
  while (chat.children.length > MAX_MESSAGES) chat.removeChild(chat.firstChild);
  let i = 0;
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  msg.appendChild(cursor);
  function typeChar() {
    if (i <= text.length) {
      msg.textContent = "E> " + text.slice(0, i);
      msg.appendChild(cursor);
      i++;
      setTimeout(typeChar, 30 + Math.random() * 30);
    } else if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
  }
  typeChar();
}
const interrupts = [
  "NÄR KOMMER ÖL VAGNEN?",
  "DETTA VAR ETT MEJL",
  "FIKA AR LAG",
  "KORT AVSTAMNING",
  "AGENDA 404"
];
function loop() {
  const r = Math.random();
  if (isBeerTime() && r < 0.22) {
    showInterrupt("NÄR KOMMER ÖL VAGNEN?");
    setTimeout(loop, 6000); return;
  }
  if (isHungryTime() && r < 0.18) {
    showInterrupt("NÄR SKA VI ÄTA?");
    setTimeout(loop, 6000); return;
  }
  if (r < 0.07) {
    showInterrupt(interrupts[Math.floor(Math.random()*interrupts.length)]);
    setTimeout(loop, 6000); return;
  }
  if (r < 0.14) {
    const s1 = specials[Math.floor(Math.random() * specials.length)];
    addMessage(s1.text, s1.type);
    setTimeout(() => {
      const s2 = specials[Math.floor(Math.random() * specials.length)];
      addMessage(s2.text, s2.type);
      setTimeout(loop, 3000);
    }, 3500);
    return;
  }
  if (r < 0.35) statusEl.textContent = statuses[Math.floor(Math.random() * statuses.length)];
  const msg = messages[Math.floor(Math.random() * messages.length)];
  addMessage(msg.text, msg.type);
  setTimeout(loop, 2800 + Math.random() * 2800);
}
addMessage("Authenticating Erik...", "");
setTimeout(() => {
  addMessage("Access granted. Mejl-kernel oppen. Moten: avbokade.", "success");
  setTimeout(loop, 2500);
}, 1500);
</script>
</body>
</html>
