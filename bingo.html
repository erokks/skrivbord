<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mötesbingo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#14213d;color:#fff;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;padding:1.6vh 2vw;gap:1.4vh;}
.top{display:flex;justify-content:space-between;align-items:baseline;}
.logo{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(1.8rem,7vh,3.2rem);letter-spacing:4px;color:#fca311;}
.meta{font-size:clamp(.85rem,2.8vh,1.2rem);color:#9fb3d9;letter-spacing:1px;}
#grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:1vh;min-height:0;}
.sq{background:#f5f1e6;color:#14213d;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:.6vh .8vw;font-weight:800;font-size:clamp(.85rem,3vh,1.35rem);line-height:1.12;position:relative;overflow:hidden;}
.sq.hit:after{content:"";position:absolute;width:min(13vh,80%);aspect-ratio:1;border-radius:50%;background:rgba(220,30,60,.55);animation:dab .25s cubic-bezier(.2,1.4,.4,1);}
.sq.win{background:#fca311;}
@keyframes dab{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
#said{background:#0b1426;border-left:6px solid #fca311;border-radius:6px;padding:1.2vh 1.4vw;font-size:clamp(1.05rem,3.8vh,1.7rem);min-height:2.4em;display:flex;align-items:center;gap:1vw;}
#said b{color:#fca311;white-space:nowrap;}
#bingo{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,5,.9);text-align:center;}
#bingo .l{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(4rem,22vh,10rem);color:#fca311;letter-spacing:8px;line-height:1;animation:dab .4s cubic-bezier(.2,1.4,.4,1);}
#bingo .r{width:42px;height:2px;background:#00ff88;margin:2.4vh 0 1.8vh;}
#bingo .k{font-size:clamp(1rem,3.8vh,1.6rem);letter-spacing:3px;text-transform:uppercase;color:#bbb;}
</style>
</head>
<body>
<div class="top"><div class="logo">MÖTESBINGO</div><div class="meta">Snabb avstämning · 14:00–? · 14 deltagare</div></div>
<div id="grid"></div>
<div id="said"><b>🎙</b><span id="line">Mötet börjar...</span></div>
<div id="bingo"><div class="l">BINGO!</div><div class="r"></div><div class="k" id="prize"></div></div>
<script>
/* Rutor fylls i när någon säger det. Alla säger det alltid. */
var Q=[
  ["Ser ni min skärm?","Mötesledaren","Ser ni min skärm? ...Nu då?"],
  ["Du är på mute","Alla","Du är på mute. DU ÄR PÅ MUTE."],
  ["Snabb fråga","Någon i chatten","Snabb fråga bara!"],
  ["Vi tar det offline","Mötesledaren","Vi tar det offline."],
  ["En sista grej","Mötesledaren","Okej, en sista grej..."],
  ["Kan vi parkera det?","Någon","Kan vi parkera det?"],
  ["Hör ni mig?","Någon på tåget","Hör ni mig? Hallå? Hör ni mig?"],
  ["Vi väntar 2 min till","Mötesledaren","Vi väntar två minuter till på folk."],
  ["Eko","Rum B","Eko... eko... eko..."],
  ["Hund i bakgrunden","Någons hund","VOFF!"],
  ["Vi är lite över tiden","Mötesledaren","Vi är lite över tiden, men..."],
  ["Kan du ta det igen?","Någon som läste mejl","Förlåt, kan du ta det igen?"],
  ["Spelar vi in?","Någon","Spelar vi in det här?"],
  ["Låt oss cirkla tillbaka","Mötesledaren","Låt oss cirkla tillbaka till det."],
  ["Fel fönster","Mötesledaren","Oj, det där var fel fönster."],
  ["Hård stopp","Någon","Jag har en hård stopp om fem."],
  ["Har alla fått inbjudan?","Mötesledaren","Har alla fått inbjudan?"],
  ["Nu frös du","Alla","Du frös. Nu frös du igen."],
  ["Win-win","Någon från sälj","Det här är ju en win-win."],
  ["Ingen agenda","Skärmen","Finns det en agenda? Nej."]
];
var PRIZES=["Vinst: ett uppföljningsmöte","Vinst: ett till möte, samma tid nästa vecka","Vinst: du får ta anteckningar","Vinst: 'snabb fråga' från mötesledaren"];
var LINES=[];for(var r=0;r<4;r++){LINES.push([r*4,r*4+1,r*4+2,r*4+3]);LINES.push([r,r+4,r+8,r+12]);}LINES.push([0,5,10,15]);LINES.push([3,6,9,12]);
var G=document.getElementById("grid");
function round(){
  var pool=Q.slice().sort(function(){return Math.random()-.5}).slice(0,16);
  G.innerHTML="";pool.forEach(function(q){var d=document.createElement("div");d.className="sq";d.textContent=q[0];G.appendChild(d);});
  document.getElementById("bingo").style.display="none";
  var line=LINES[Math.floor(Math.random()*LINES.length)];
  var others=[];for(var k=0;k<16;k++)if(line.indexOf(k)<0)others.push(k);
  others.sort(function(){return Math.random()-.5});
  var order=[line[0],others[0],line[1],others[1],others[2],line[2],others[3],line[3]];
  order.forEach(function(idx,n){
    setTimeout(function(){
      var q=pool[idx];document.getElementById("line").innerHTML="";var b=document.createElement("b");b.textContent=q[1]+":";var sp=document.createElement("span");sp.textContent="“"+q[2]+"”";
      var L=document.getElementById("line");L.appendChild(b);L.appendChild(document.createTextNode(" "));L.appendChild(sp);
      G.children[idx].classList.add("hit");
    },1200+n*1700);
  });
  setTimeout(function(){
    line.forEach(function(i){G.children[i].classList.add("win");});
    setTimeout(function(){document.getElementById("prize").textContent=PRIZES[Math.floor(Math.random()*PRIZES.length)];document.getElementById("bingo").style.display="flex";},900);
  },1200+order.length*1700);
  setTimeout(round,1200+order.length*1700+6000);
}
round();
</script>
</body>
</html>
