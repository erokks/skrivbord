<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teams</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1b1a19;color:#fff;font-family:'Segoe UI',Arial,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.top{background:#292827;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;font-size:.95rem;}
.pill{background:#c4314b;padding:3px 10px;border-radius:4px;font-size:.75rem;letter-spacing:1px;}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:10px;}
.tile{background:#3b3a39;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.av{font-size:2.8rem;margin-bottom:8px;opacity:.85;}
.nm{font-size:.9rem;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:4px;position:absolute;left:8px;bottom:8px;}
.mute{position:absolute;right:8px;bottom:8px;font-size:.8rem;opacity:.6;}
.chat{height:34vh;background:#201f1e;border-top:1px solid #444;padding:10px 16px;overflow:hidden;font-size:1.05rem;}
.m{margin:6px 0;opacity:0;animation:in .3s forwards;}
@keyframes in{to{opacity:1}}
.who{color:#62d0ff;font-weight:700;margin-right:6px;}
.you{color:#9bf09b;}
</style>
</head>
<body>
<div class="top"><span>Synergi 2.0 (optional, men kom) • 47 deltagare • 1 skarm</span><span class="pill">REC</span></div>
<div class="grid">
  <div class="tile" style="background:#123"><div class="av">SCR</div><div class="nm">Skarmen (Gast)</div><div class="mute">LIVE</div></div>
  <div class="tile"><div class="av">☕</div><div class="nm">Kaffemaskinen</div><div class="mute">muted</div></div>
  <div class="tile"><div class="av">PRT</div><div class="nm">Skrivaren</div><div class="mute">PC LOAD LETTER</div></div>
  <div class="tile"><div class="av">XLS</div><div class="nm">FINAL_v12.xlsx</div><div class="mute">sharing</div></div>
  <div class="tile"><div class="av">🦆</div><div class="nm">Albatrossen</div><div class="mute">away</div></div>
  <div class="tile"><div class="av">FIK</div><div class="nm">Fikarummet</div><div class="mute">echo</div></div>
</div>
<div class="chat" id="c"></div>
<script>
var M=[
  ["Skarmen (Gast)","Hej! Jag ar en skarm. 27 tum. Jag kan inte sitta ner men jag ar har."],
  ["Kaffemaskinen","vem la till monitorn"],
  ["Skarmen (Gast)","Jag lade till mig sjalv. Kalendern sa optional. Optional ar mitt mellannamn."],
  ["Skrivaren","jag delar en PDF. den heter PDF. den ar 90 sidor. den ar tom."],
  ["FINAL_v12.xlsx","VLOOKUP misslyckades. Igen. Jag tar det personligt men professionellt."],
  ["Albatrossen","jag flyger. ni har stilla. agenda?"],
  ["Skarmen (Gast)","Agenda: 1) fika 2) HDMI 3) resten av livet"],
  ["Fikarummet","echo echo... kan ni hore mig... jag ar ett rum"],
  ["Kaffemaskinen","du ar muted skarmen"],
  ["Skarmen (Gast)","JAG HAR INGEN MIKROFON JAG HAR EN SKARMTEXT"],
  ["Skrivaren","pappersstopp som protest. det ar konst."],
  ["Skarmen (Gast)","Kan nagon zooma? Jag AR zoomen. Tack for att ni kom. Vi ses i 60 Hz."]
];
var i=0,c=document.getElementById("c");
function nx(){
  if(i>=M.length){i=0;c.innerHTML="";}
  var d=document.createElement("div");
  d.className="m";
  var cls=M[i][0].indexOf("Skarmen")>=0?"you":"who";
  d.innerHTML='<span class="'+cls+'">'+M[i][0]+'</span> '+M[i][1];
  c.appendChild(d);
  while(c.children.length>6)c.removeChild(c.firstChild);
  i++;
}
nx();setInterval(nx,1600);
</script>
</body>
</html>
