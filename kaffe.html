<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KAFFE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#120900;color:#e8c9a0;font-family:"Share Tech Mono",Consolas,monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vw;}
.panel{width:min(92vw,640px);border:1px solid #5a3210;background:#1a0c00;box-shadow:0 0 0 6px #0a0500,0 20px 50px rgba(0,0,0,.6);}
.head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #5a3210;font-size:.78rem;letter-spacing:3px;color:#c47a3a;text-transform:uppercase;}
.def{padding:18px 20px 8px;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(2rem,5.8vw,3.6rem);letter-spacing:4px;color:#ff6600;text-shadow:0 0 18px #ff440066;}
.msg{padding:4px 20px 16px;font-size:clamp(1.05rem,2.6vw,1.45rem);line-height:1.4;min-height:2.6em;color:#f0d2b0;}
.barwrap{margin:0 20px 16px;height:10px;border:1px solid #ff6600;background:#2a1200;}
.fill{height:100%;background:linear-gradient(90deg,#ff4400,#ffcc66);width:12%;transition:width .4s;}
.foot{padding:8px 16px;border-top:1px solid #5a3210;font-size:.72rem;letter-spacing:1.5px;color:#8a5a30;}
</style>
</head>
<body>
<div class="panel">
  <div class="head"><span>KAFFE-SYSTEMET</span><span id="clk">04:20</span></div>
  <div class="def" id="def">DEFCON 2</div>
  <div class="msg" id="msg">Brygg-niva: motet har inte fortjanat kopp 2.</div>
  <div class="barwrap"><div class="fill" id="fill"></div></div>
  <div class="foot" id="log">BOOT: kaffe.sys ... OK</div>
</div>
<script>
var msgs=[
  "Brygg-niva: motet har inte fortjanat kopp 2.",
  "Bonorna har bildat fack. Krav: fika. Inte 90 min avstamning.",
  "Decaf upptackt i sektorn. Evakuering. Motet stannade.",
  "Statistik: 14 koppar, 0 beslut, 1 PowerPoint.",
  "Kaffet dog. Mandagen overlevde. Olycka.",
  "Bryggprotokoll 4.20: inga moten over kaffet.",
  "Kaffemaskinen mute:a motet. Enda vettiga beslutet idag.",
  "Sista kanelbullen gick till ett mote. Den dog forintet.",
  "Espresso forhandlar med kalendern. Kalendern at lunchen.",
  "Albatros flyger battre efter kopp tva. Motet gor inte det."
];
var defs=["DEFCON 3","DEFCON 2","DEFCON 1","DEFCON FIKA","DEFCON OEL?","DEFCON 2"];
var logs=["BOOT: kaffe.sys ... OK","SENSOR: lukt av mote","ALERT: decaf i sektorn","INFO: kalendern at lunchen","WARN: kopp till ett 90-min","OK: fika-policy > agenda","NOTE: motet har inte fortjanat kopp 2.","PING: 418 I'm a teapot."];
var i=0,p=12;
function nx(){
  document.getElementById("msg").textContent=msgs[i%msgs.length];
  document.getElementById("def").textContent=defs[i%defs.length];
  document.getElementById("log").textContent="> "+logs[i%logs.length];
  var n=new Date();
  document.getElementById("clk").textContent=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  p=Math.min(100,p+8+Math.random()*10);
  document.getElementById("fill").style.width=p+"%";
  i++;
}
nx();setInterval(nx,2200);
</script>
</body>
</html>
