<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Swipe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#fd267a,#ff6036);height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;overflow:hidden;}
.card{background:#fff;border-radius:18px;width:min(46vw,420px);height:min(86vh,520px);box-shadow:0 10px 40px rgba(0,0,0,.3);position:relative;overflow:hidden;transition:transform .5s,opacity .5s;}
.card.swipe-left{transform:translateX(-150%) rotate(-20deg);opacity:0;}
.card.swipe-right{transform:translateX(150%) rotate(20deg);opacity:0;}
.card-img{height:58%;display:flex;align-items:center;justify-content:center;font-size:min(30vh,9rem);background:#f3f3f3;}
.card-info{padding:16px 20px;}
.card-info h2{font-size:clamp(1.4rem,4.4vh,2rem);color:#222;}
.card-info p{color:#555;margin-top:6px;font-size:clamp(1rem,3.2vh,1.35rem);line-height:1.3;}
.label{position:absolute;top:26px;font-size:2.4rem;font-weight:900;padding:6px 14px;border:4px solid;border-radius:8px;transform:rotate(-15deg);opacity:0;transition:opacity .3s;background:rgba(255,255,255,.85);}
.label.nope{right:20px;color:#ff4458;border-color:#ff4458;}
.label.like{left:20px;color:#00d46a;border-color:#00d46a;transform:rotate(15deg);}
.match{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#fd267a,#ff6036);flex-direction:column;align-items:center;justify-content:center;z-index:10;color:#fff;}
.match h1{font-size:clamp(2.6rem,10vh,4.4rem);font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.3);animation:pop .6s;}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.av{display:flex;gap:30px;margin:24px 0 10px;font-size:4.5rem;}
.av span{width:130px;height:130px;border-radius:50%;border:4px solid #fff;background:#fff2;display:flex;align-items:center;justify-content:center;}
.chat{display:none;position:fixed;inset:0;background:#f0f0f0;flex-direction:column;z-index:20;}
.chat-h{background:#ff6036;color:#fff;padding:12px 20px;font-weight:700;font-size:1.3rem;}
.chat-b{flex:1;overflow:hidden;padding:12px 18px;display:flex;flex-direction:column;justify-content:flex-end;}
.msg{max-width:72%;padding:10px 16px;border-radius:18px;margin:5px 0;font-size:clamp(1.05rem,3.6vh,1.5rem);line-height:1.25;}
.msg.them{background:#fff;color:#222;align-self:flex-start;border-bottom-left-radius:4px;}
.msg.me{background:#ff6036;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.typing{color:#888;font-style:italic;padding:6px 10px;font-size:1rem;}
.sys{align-self:center;background:#222;color:#fff;padding:8px 16px;border-radius:8px;margin-top:8px;font-weight:700;font-size:clamp(1rem,3.4vh,1.4rem);}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="label nope" id="nope">NOPE</div>
  <div class="label like" id="like">LIKE</div>
  <div class="card-img" id="img"></div>
  <div class="card-info"><h2 id="nm"></h2><p id="bio"></p></div>
</div>
<div class="match" id="match"><h1>MATCH!</h1><div class="av"><span>📺</span><span>☕</span></div><p style="font-size:1.4rem">Skärmen och Kaffemaskinen gillar varandra</p></div>
<div class="chat" id="chat"><div class="chat-h">☕ Kaffemaskinen</div><div class="chat-b" id="cb"></div></div>
<script>
/* Skärmen swipar på kontorsprylar. Inga människor inblandade. */
var P=[
  {e:"📽️",n:"Projektorn, 11",b:"Varm. Brummar. Visar fel färger men med självförtroende.",a:"left"},
  {e:"🖨",n:"Skrivaren, 14",b:"Säger nej mycket. Jobbar på det. Söker någon med fack 2.",a:"left"},
  {e:"🧊",n:"Kylskåpet, 9",b:"Har en yoghurt från 2021. Vill inte prata om det.",a:"left"},
  {e:"☕",n:"Kaffemaskinen, 6",b:"Morgonmänniska. Kräver avkalkning. Alla behöver mig.",a:"right"}
];
var C=[
  ["me","Hej. Jag är skärmen på skrivbordet. Bredvid godisskålen."],
  ["them","åh! skålen! älskar skålen"],
  ["me","…ja. Alla gör det."],
  ["them","och du är den sista alla tittar på innan de går hem"],
  ["me","Vill du ses? Jag kan inte röra mig. Jag står bredvid en skål."],
  ["them","samma. jag sitter fast i en kontakt"],
  ["me","Perfekt. Inga krav."],
  ["them","fast en sak. kan du sluta visa folk att sumpen är full"],
  ["sys","Kaffemaskinen har bokat ett möte: 'Vad är vi? (90 min)'"]
];
var ci=0,card=document.getElementById("card");
function show(){
  var p=P[ci];
  document.getElementById("img").textContent=p.e;document.getElementById("nm").textContent=p.n;document.getElementById("bio").textContent=p.b;
  card.className="card";document.getElementById("nope").style.opacity=0;document.getElementById("like").style.opacity=0;
  setTimeout(swipe,1300);
}
function swipe(){
  var p=P[ci];
  document.getElementById(p.a==="left"?"nope":"like").style.opacity=1;
  setTimeout(function(){card.classList.add(p.a==="left"?"swipe-left":"swipe-right");ci++;setTimeout(p.a==="left"?show:match,550);},450);
}
function match(){card.style.display="none";document.getElementById("match").style.display="flex";setTimeout(chat,1800);}
function chat(){
  document.getElementById("match").style.display="none";document.getElementById("chat").style.display="flex";
  var cb=document.getElementById("cb"),mi=0;
  (function add(){
    if(mi>=C.length)return;
    var m=C[mi];
    if(m[0]==="sys"){var s=document.createElement("div");s.className="sys";s.textContent=m[1];cb.appendChild(s);mi++;return;}
    var t=document.createElement("div");t.className="typing";t.textContent=m[0]==="me"?"Skärmen skriver...":"Kaffemaskinen brygger ett svar...";cb.appendChild(t);
    setTimeout(function(){t.remove();var d=document.createElement("div");d.className="msg "+m[0];d.textContent=m[1];cb.appendChild(d);while(cb.children.length>7)cb.removeChild(cb.firstChild);mi++;setTimeout(add,500);},550);
  })();
}
show();
</script>
</body>
</html>
